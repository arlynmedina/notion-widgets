<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books this year</title>
<script>
  // Tema: ?theme=dark o ?theme=light en el enlace; sin parámetro sigue el modo del sistema
  (function () {
    var p = new URLSearchParams(location.search).get('theme');
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function apply() { document.documentElement.dataset.theme = (p === 'dark' || p === 'light') ? p : (mq.matches ? 'dark' : 'light'); }
    apply();
    if (p !== 'dark' && p !== 'light' && mq.addEventListener) mq.addEventListener('change', apply);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --vanilla: #FAF7F2;
    --linen: #FFFFFF;
    --espresso: #2E2620;
    --sage: #8A9A86;
    --rose: #D9A5B3;
    --muted: rgba(var(--ink-rgb), 0.45);
    --ink-rgb: 46, 38, 32;
    --shadow-rgb: 46, 38, 32;
    --sage-rgb: 138, 154, 134;
    --rose-rgb: 217, 165, 179;
    --sage-tint: #EEF1EC;
    --hover: #F2EEE7;
    --latte: #C8B39B;
  }
  :root[data-theme="dark"] {
    --vanilla: #26211D;
    --linen: #322B26;
    --bone: #201C19;
    --linen-soft: #201C19;
    --espresso: #EFE7DC;
    --sage: #A3B49E;
    --rose: #E2B3C0;
    --ink-rgb: 239, 231, 220;
    --shadow-rgb: 0, 0, 0;
    --sage-rgb: 163, 180, 158;
    --rose-rgb: 226, 179, 192;
    --sage-tint: #2F352D;
    --hover: #3A322C;
    --latte: #A88F75;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: transparent; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    color: var(--espresso);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 340px; min-width: 260px;
    height: 164px;
    background: var(--linen);
    border-radius: 20px;
    box-shadow: 0 8px 28px rgba(var(--shadow-rgb), 0.06), inset 0 0 0 1px rgba(var(--ink-rgb), 0.04);
    padding: 18px 18px;
    display: flex; align-items: center; gap: 12px;
    overflow: hidden;
  }

  .mini {
    flex: 0 0 auto;
    width: 32px; height: 32px;
    border: none; border-radius: 50%;
    background: var(--vanilla);
    color: var(--espresso);
    font: inherit; font-size: 17px; font-weight: 400; line-height: 1;
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.25s ease, box-shadow 0.25s ease;
  }
  .mini:hover { background: var(--hover); }
  .mini:active { transform: scale(0.88); box-shadow: 0 0 0 5px rgba(var(--sage-rgb), 0.15); }

  .center { flex: 1; min-width: 0; text-align: center; }
  .year {
    font-size: 10px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--muted);
  }
  .year { display: flex; align-items: center; justify-content: center; gap: 2px; }
  .yr {
    border: none; background: transparent; cursor: pointer;
    font: inherit; font-size: 12px; letter-spacing: 0; color: rgba(var(--ink-rgb), 0.28);
    width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .yr:hover { color: var(--espresso); background: var(--vanilla); }
  .line {
    margin-top: 6px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 21px; font-weight: 500; font-style: italic;
    font-variant-numeric: lining-nums;
    color: var(--muted);
    white-space: nowrap;
  }
  .line b {
    font-style: normal; font-weight: 600; font-size: 38px;
    color: var(--espresso);
    display: inline-block; min-width: 0.6em;
    transition: transform 0.25s ease;
  }
  .line b.bump { transform: translateY(-3px); }
  .goal {
    font: inherit; font-style: normal; font-weight: 600; color: var(--espresso);
    width: 2.1ch; border: none; background: transparent; outline: none;
    text-align: center; border-radius: 6px;
    -moz-appearance: textfield;
  }
  .goal::-webkit-outer-spin-button, .goal::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .goal:focus { background: var(--vanilla); }

  .bar {
    margin: 14px auto 0;
    width: 86%; height: 3px;
    border-radius: 999px;
    background: rgba(var(--ink-rgb), 0.07);
    overflow: hidden;
  }
  .fill {
    height: 100%; width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--latte), var(--sage));
    transition: width 0.7s cubic-bezier(.22, .8, .3, 1);
  }
</style>
</head>
<body>
  <div class="card">
    <button class="mini" id="minus" type="button" aria-label="One book less">−</button>
    <div class="center">
      <div class="year"><button class="yr" id="prevYear" type="button" aria-label="Previous year">‹</button><span id="year"></span><button class="yr" id="nextYear" type="button" aria-label="Next year">›</button></div>
      <div class="line">Book <b id="count">0</b> of <input class="goal" id="goal" type="number" min="1" max="999" aria-label="Yearly goal"></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>
    <button class="mini" id="plus" type="button" aria-label="One book more">+</button>
  </div>

<script>
  // Cada año tiene su propia cuenta y meta; el año elegido también se guarda.
  const YEAR_KEY = 'cozy-books-year';
  const countEl = document.getElementById('count');
  const goalEl = document.getElementById('goal');
  const fill = document.getElementById('fill');
  const yearEl = document.getElementById('year');

  let year = new Date().getFullYear();
  try { year = parseInt(localStorage.getItem(YEAR_KEY), 10) || year; } catch (e) {}
  let state;

  function loadYear() {
    state = { count: 0, goal: 25 };
    try { state = Object.assign(state, JSON.parse(localStorage.getItem('cozy-books-' + year)) || {}); } catch (e) {}
    try { localStorage.setItem(YEAR_KEY, year); } catch (e) {}
    yearEl.textContent = 'Goal ' + year;
  }
  const save = () => { try { localStorage.setItem('cozy-books-' + year, JSON.stringify(state)); } catch (e) {} };

  function changeYear(delta) {
    year += delta;
    loadYear(); render();
  }
  document.getElementById('prevYear').addEventListener('click', () => changeYear(-1));
  document.getElementById('nextYear').addEventListener('click', () => changeYear(1));
  loadYear();

  function render() {
    countEl.textContent = state.count;
    if (document.activeElement !== goalEl) goalEl.value = state.goal;
    goalEl.style.width = (String(goalEl.value || state.goal).length + 0.4) + 'ch';
    fill.style.width = Math.min(100, (state.count / state.goal) * 100) + '%';
  }

  function change(delta) {
    state.count = Math.max(0, Math.min(999, state.count + delta));
    save(); render();
    countEl.classList.add('bump');
    setTimeout(() => countEl.classList.remove('bump'), 180);
  }

  document.getElementById('plus').addEventListener('click', () => change(1));
  document.getElementById('minus').addEventListener('click', () => change(-1));

  goalEl.addEventListener('input', () => {
    const v = parseInt(goalEl.value, 10);
    if (v > 0) { state.goal = Math.min(999, v); save(); }
    render();
  });
  goalEl.addEventListener('blur', render);
  goalEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') goalEl.blur(); });

  render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading streak</title>
<script>
  // Tema: ?theme=dark o ?theme=light en el enlace; sin parámetro sigue el modo del sistema
  (function () {
    var p = new URLSearchParams(location.search).get('theme');
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function apply() { document.documentElement.dataset.theme = (p === 'dark' || p === 'light') ? p : (mq.matches ? 'dark' : 'light'); }
    apply();
    if (p !== 'dark' && p !== 'light' && mq.addEventListener) mq.addEventListener('change', apply);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --vanilla: #FAF7F2;
    --linen: #FFFFFF;
    --espresso: #2E2620;
    --sage: #8A9A86;
    --rose: #D9A5B3;
    --muted: rgba(var(--ink-rgb), 0.45);
    --ink-rgb: 46, 38, 32;
    --shadow-rgb: 46, 38, 32;
    --sage-rgb: 138, 154, 134;
    --rose-rgb: 217, 165, 179;
    --sage-tint: #EEF1EC;
    --hover: #F2EEE7;
    --latte: #C8B39B;
  }
  :root[data-theme="dark"] {
    --vanilla: #26211D;
    --linen: #322B26;
    --bone: #201C19;
    --linen-soft: #201C19;
    --espresso: #EFE7DC;
    --sage: #A3B49E;
    --rose: #E2B3C0;
    --ink-rgb: 239, 231, 220;
    --shadow-rgb: 0, 0, 0;
    --sage-rgb: 163, 180, 158;
    --rose-rgb: 226, 179, 192;
    --sage-tint: #2F352D;
    --hover: #3A322C;
    --latte: #A88F75;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: transparent; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    color: var(--espresso);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 340px; min-width: 260px;
    height: 164px;
    background: var(--vanilla);
    border-radius: 20px;
    box-shadow: 0 8px 28px rgba(var(--shadow-rgb), 0.06);
    padding: 20px 22px;
    display: flex; align-items: center; gap: 16px;
    overflow: hidden;
  }

  /* Icono vela */
  .icon {
    flex: 0 0 auto;
    width: 64px; height: 64px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--linen);
    transition: box-shadow 0.8s ease, background 0.8s ease;
  }
  .icon svg { width: 34px; height: 34px; }
  .icon .flame { fill: rgba(var(--ink-rgb), 0.14); transition: fill 0.8s ease; transform-origin: 50% 90%; }
  .icon .wax { fill: none; stroke: rgba(var(--ink-rgb), 0.35); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.8s ease; }
  .active .icon {
    background: var(--sage-tint);
    box-shadow: 0 0 0 6px rgba(var(--sage-rgb), 0.10), 0 0 26px rgba(var(--sage-rgb), 0.45);
    animation: glow 3.2s ease-in-out infinite;
  }
  .active .icon .flame { fill: var(--sage); animation: flicker 2.6s ease-in-out infinite; }
  .active .icon .wax { stroke: var(--sage); }
  @keyframes glow {
    50% { box-shadow: 0 0 0 8px rgba(var(--sage-rgb), 0.06), 0 0 34px rgba(var(--sage-rgb), 0.6); }
  }
  @keyframes flicker {
    0%, 100% { transform: scale(1) rotate(0deg); }
    30% { transform: scale(1.05, 0.96) rotate(-2deg); }
    60% { transform: scale(0.97, 1.04) rotate(2deg); }
  }

  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .count { display: flex; align-items: baseline; gap: 8px; line-height: 1; }
  .num {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 54px; font-weight: 600; letter-spacing: -0.02em;
    font-variant-numeric: lining-nums;
    outline: none; cursor: text;
    border-radius: 10px; padding: 0 4px; margin-left: -4px;
    transition: background 0.25s ease;
  }
  .num:hover, .num:focus { background: var(--linen); }
  .label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic; font-size: 18px; font-weight: 500;
    color: var(--muted);
  }

  .btn {
    align-self: flex-start;
    border: 1px solid rgba(var(--sage-rgb), 0.45);
    background: var(--linen);
    color: var(--espresso);
    font: inherit; font-size: 12.5px; font-weight: 500; letter-spacing: 0.02em;
    padding: 8px 14px;
    white-space: nowrap; flex: 0 0 auto;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease, transform 0.15s ease, border-color 0.3s ease;
  }
  .btn:hover { border-color: var(--sage); }
  .btn:active { transform: scale(0.96); }
  .card { position: relative; }
  .best {
    position: absolute; top: 13px; right: 16px;
    font-size: 9.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
  }
  .best b { font-weight: 600; color: var(--espresso); letter-spacing: 0.06em; }
  .row { display: flex; align-items: center; gap: 10px; }
  .week { display: flex; gap: 4px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(var(--ink-rgb), 0.09);
    transition: background 0.4s ease;
  }
  .dot.read { background: var(--sage); }
  .dot.today { box-shadow: 0 0 0 1.5px var(--vanilla), 0 0 0 2.5px rgba(var(--sage-rgb), 0.5); }
  .btn.done {
    background: var(--sage); border-color: var(--sage); color: var(--linen);
    cursor: default;
  }
  @media (max-width: 335px) {
    .card { padding: 20px 16px; gap: 12px; }
    .icon { width: 52px; height: 52px; }
    .icon svg { width: 28px; height: 28px; }
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="best" id="best">best <b>0</b></div>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <path class="flame" d="M16 3.5c2.6 3.1 4 5.3 4 7.6a4 4 0 0 1-8 0c0-2.3 1.4-4.5 4-7.6z"/>
        <path class="wax" d="M11 17.5h10v10.5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 11 28z"/>
        <path class="wax" d="M16 15.2v2.3"/>
      </svg>
    </div>
    <div class="info">
      <div class="count">
        <span class="num" id="num" contenteditable="true" inputmode="numeric" spellcheck="false" title="Tap to edit your streak">0</span>
        <span class="label" id="label">days in a row</span>
      </div>
      <div class="row">
        <button class="btn" id="btn" type="button">Read today</button>
        <div class="week" id="week" title="Last 7 days"></div>
      </div>
    </div>
  </div>

<script>
  const KEY = 'cozy-streak-v1';
  const card = document.getElementById('card');
  const numEl = document.getElementById('num');
  const labelEl = document.getElementById('label');
  const btn = document.getElementById('btn');
  const bestEl = document.getElementById('best');
  const weekEl = document.getElementById('week');

  const dayKey = (d) => {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
  };
  const today = () => dayKey(new Date());
  const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); };

  function load() {
    const base = { count: 0, last: null, best: 0, days: [] };
    try { return Object.assign(base, JSON.parse(localStorage.getItem(KEY)) || {}); }
    catch (e) { return base; }
  }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }

  let state = load();
  state.best = Math.max(state.best, state.count);

  // Si el último día leído no es hoy ni ayer, la racha se rompió (la mejor racha se conserva).
  function checkBroken() {
    if (state.last && state.last !== today() && state.last !== yesterday() && state.count !== 0) {
      state.count = 0;
      save(state);
    }
  }

  // Puntitos de los últimos 7 días, el de la derecha es hoy
  function renderWeek() {
    weekEl.innerHTML = '';
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const dot = document.createElement('span');
      dot.className = 'dot' + (state.days.includes(dayKey(d)) ? ' read' : '') + (i === 0 ? ' today' : '');
      weekEl.appendChild(dot);
    }
  }

  function render() {
    checkBroken();
    bestEl.innerHTML = 'best <b>' + state.best + '</b>';
    renderWeek();
    const doneToday = state.last === today();
    if (document.activeElement !== numEl) numEl.textContent = state.count;
    labelEl.textContent = state.count === 1 ? 'day in a row' : 'days in a row';
    card.classList.toggle('active', state.count > 0);
    btn.classList.toggle('done', doneToday);
    btn.textContent = doneToday ? 'Read today ✓' : 'Read today';
  }

  // El número se puede corregir a mano (por ejemplo, para continuar una racha de 200 días).
  numEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); numEl.blur(); }
    else if (e.key.length === 1 && !/[0-9]/.test(e.key)) e.preventDefault();
  });
  numEl.addEventListener('focus', () => setTimeout(() => document.getSelection().selectAllChildren(numEl), 0));
  numEl.addEventListener('blur', () => {
    const v = parseInt(numEl.textContent.replace(/\D/g, ''), 10);
    if (!isNaN(v)) {
      state.count = Math.min(99999, v);
      state.best = Math.max(state.best, state.count);
      // Si hoy aún no se marcó, la racha queda viva desde ayer para que el próximo clic sume uno.
      if (state.last !== today()) state.last = state.count > 0 ? yesterday() : null;
      save(state);
    }
    render();
  });

  btn.addEventListener('click', () => {
    if (state.last === today()) return;
    state.count = state.last === yesterday() ? state.count + 1 : 1;
    state.last = today();
    state.best = Math.max(state.best, state.count);
    state.days = [...state.days.filter(d => d !== today()), today()].slice(-60);
    save(state);
    render();
  });

  // Revisa el cambio de día si el widget queda abierto.
  setInterval(render, 60 * 1000);
  render();
</script>
</body>
</html>

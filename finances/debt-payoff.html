<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debt payoff</title>
<script>
  // Theme: add ?theme=light or ?theme=dark to the link to fix it; without it the widget follows the system setting
  (function () {
    var p = new URLSearchParams(location.search).get('theme');
    var fixed = p === 'light' || p === 'dark';
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function apply() {
      document.documentElement.dataset.theme = fixed ? p : (mq.matches ? 'dark' : 'light');
      window.dispatchEvent(new Event('themechange'));
    }
    apply();
    if (!fixed && mq.addEventListener) mq.addEventListener('change', apply);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --linen: #FDFBF7;
    --ink: #1E1E1E;
    --ink-rgb: 30, 30, 30;
    --muted: rgba(var(--ink-rgb), 0.5);
    --faint: rgba(var(--ink-rgb), 0.09);
    --emerald: #2D5A43;
    --emerald-rgb: 45, 90, 67;
    --emerald-hi: #3E7A5B;
    --emerald-soft: rgba(var(--emerald-rgb), 0.09);
    --solid: #2D5A43;
    --solid-hover: #24493A;
    --on-solid: #FDFBF7;
    --gold: #C5A880;
    --gold-ink: #9C7E52;
    --gold-soft: rgba(197, 168, 128, 0.16);
    --warn: #A0703F;
    --sage: #8FA996;
    --latte: #C4A484;
    --sand: #E6D8C1;
    --sand-ink: #7A6142;
    --grey: #ECE8E1;
    --glass: rgba(255, 255, 255, 0.55);
    --shine: rgba(255, 255, 255, 0.9);
    --liq-top: #3B7257;
    --liq-bot: #2D5A43;
    --liq-back: #5E8C73;
  }
  :root[data-theme="dark"] {
    --linen: #1B1A18;
    --ink: #EDE8DF;
    --ink-rgb: 237, 232, 223;
    --muted: rgba(var(--ink-rgb), 0.55);
    --faint: rgba(var(--ink-rgb), 0.12);
    --emerald: #74AA8C;
    --emerald-rgb: 116, 170, 140;
    --emerald-hi: #8CBEA2;
    --emerald-soft: rgba(var(--emerald-rgb), 0.12);
    --solid: #3A7457;
    --solid-hover: #458566;
    --on-solid: #F6F2EA;
    --gold: #C5A880;
    --gold-ink: #D8BF97;
    --gold-soft: rgba(197, 168, 128, 0.14);
    --warn: #DDA06A;
    --sage: #7E9C88;
    --latte: #B48F69;
    --sand: #8A7B62;
    --sand-ink: #F3EADB;
    --grey: #2C2A27;
    --glass: rgba(255, 255, 255, 0.04);
    --shine: rgba(255, 255, 255, 0.14);
    --liq-top: #4F8A6C;
    --liq-bot: #2F5E47;
    --liq-back: #2C4F3E;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--linen); }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    width: 100%; max-width: 360px;
    height: 100%; max-height: 220px;
    padding: 12px 16px 14px;
    display: flex; flex-direction: column; gap: 10px;
    border: 1px solid var(--faint);
    border-radius: 18px;
    background: var(--linen);
  }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 16px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap;
  }
  .title em { font-style: italic; color: var(--emerald); }
  .cur {
    appearance: none; -webkit-appearance: none;
    border: 1px solid var(--faint); background: transparent; border-radius: 999px;
    font: 600 9.5px/1 'Plus Jakarta Sans', sans-serif; letter-spacing: 0.08em;
    color: var(--muted); padding: 5px 9px; cursor: pointer; outline: 0;
    transition: border-color .2s, color .2s;
  }
  .cur:hover, .cur:focus-visible { border-color: var(--gold); color: var(--ink); }
  .lbl {
    font-size: 8.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; white-space: nowrap;
  }
  .field {
    display: flex; align-items: baseline; gap: 3px;
    border-bottom: 1px solid var(--faint); padding: 2px 0 3px;
    transition: border-color .2s;
  }
  .field:focus-within { border-color: var(--emerald); }
  .field .pre { font-size: 12px; color: var(--muted); }
  .field input {
    border: 0; background: transparent; outline: 0; width: 100%; min-width: 0;
    font: 600 14px 'Plus Jakarta Sans', sans-serif; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .field input::placeholder { color: rgba(var(--ink-rgb), 0.25); }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .num { font-variant-numeric: tabular-nums; }
  .btn {
    border: 1px solid var(--faint); background: transparent; border-radius: 999px;
    font: 600 11px/1 'Plus Jakarta Sans', sans-serif; color: var(--ink);
    padding: 7px 10px; cursor: pointer; transition: background .2s, border-color .2s, color .2s, transform .1s;
  }
  .btn:hover { border-color: var(--gold); background: var(--gold-soft); }
  .btn:active { transform: scale(0.96); }
  .btn.solid { background: var(--solid); border-color: var(--solid); color: var(--on-solid); }
  .btn.solid:hover { background: var(--solid-hover); border-color: var(--solid-hover); }

  .headline { margin-top: 6px; font-family: 'Playfair Display', serif; font-size: 15px; line-height: 1.15; }
  .headline b { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.04em; color: var(--emerald); vertical-align: -2px; margin: 0 2px; }
  .bar { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; height: 30px; margin-top: 4px; }
  .seg { position: relative; background: var(--grey); border-radius: 5px; overflow: hidden; }
  .seg:first-child { border-radius: 15px 5px 5px 15px; }
  .seg:last-child { border-radius: 5px 15px 15px 5px; }
  .seg i {
    position: absolute; inset: 0; transform-origin: left; transform: scaleX(0);
    background: linear-gradient(180deg, var(--emerald-hi), var(--emerald));
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .seg.full i { box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
  .meta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: -4px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .undo { border: 0; background: none; font: inherit; color: var(--gold); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; margin-left: 6px; }
  .undo[hidden] { display: none; }
  .form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; margin-top: auto; }
  .form .field input { font-size: 13px; }
  .form .btn { padding: 8px 12px; }
  .done .headline b { color: var(--gold); }

</style>
</head>
<body>
<main class="card">
  <header class="head">
    <h1 class="title">Debt <em>payoff</em></h1>
    <select class="cur" id="cur" aria-label="Currency">
      <option value="USD">$ USD</option>
      <option value="MXN">$ MXN</option>
      <option value="EUR">€ EUR</option>
    </select>
  </header>

  <p class="headline">You’ve paid off<b class="num" id="pct">0%</b>of your debt</p>
  <div class="bar" id="bar" role="img" aria-label="Debt progress"></div>
  <div class="meta num"><span>Paid <b id="paid">$0</b><button class="undo" id="undo" hidden>undo</button></span><span>Left <b id="left">$0</b></span></div>
  <div class="form">
    <div><div class="lbl">Total debt</div><label class="field"><span class="pre" data-sym>$</span><input id="total" type="number" inputmode="decimal" min="0" step="any" placeholder="5000" aria-label="Total debt balance"></label></div>
    <div><div class="lbl">Payment</div><label class="field"><span class="pre" data-sym>$</span><input id="pay" type="number" inputmode="decimal" min="0" step="any" placeholder="0" aria-label="Payment made"></label></div>
    <button class="btn solid" id="add">Pay</button>
  </div>

</main>
<script>
  // Shared helpers: safe storage, currency and formatting
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var SYM = { USD: '$', MXN: '$', EUR: '€' };
  var cur = store.get('fw-currency', 'USD');
  if (!SYM[cur]) cur = 'USD';
  var curSel = document.getElementById('cur');
  curSel.value = cur;
  function num(v) { var n = parseFloat(String(v).replace(/,/g, '')); return isFinite(n) && n > 0 ? n : 0; }
  function money(n, dec) {
    var d = dec == null ? (Math.round(n) === n ? 0 : 2) : dec;
    return SYM[cur] + n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function syncSymbols() {
    document.querySelectorAll('[data-sym]').forEach(function (el) { el.textContent = SYM[cur]; });
  }
  function onCurrency(fn) {
    curSel.addEventListener('change', function () { var prev = cur; cur = curSel.value; store.set('fw-currency', cur); syncSymbols(); fn(prev); });
    // If another widget changes the currency in the same browser, this one follows
    window.addEventListener('storage', function (e) {
      if (e.key === 'fw-currency') { var prev = cur; cur = store.get('fw-currency', 'USD'); curSel.value = cur; syncSymbols(); fn(prev); }
    });
    syncSymbols();
  }

  var KEY = 'fw-debt-payoff';
  var st = store.get(KEY, { total: '5000', payments: [] });
  var totalIn = document.getElementById('total'), payIn = document.getElementById('pay');
  var bar = document.getElementById('bar');
  totalIn.value = st.total;
  for (var i = 0; i < 10; i++) { var s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; bar.appendChild(s); }

  function save() { store.set(KEY, st); }
  function paidSum() { return st.payments.reduce(function (a, b) { return a + b; }, 0); }

  function render() {
    var total = num(totalIn.value), paid = paidSum();
    var p = total > 0 ? Math.min(paid / total, 1) : 0;
    bar.querySelectorAll('.seg').forEach(function (seg, i) {
      var f = Math.max(0, Math.min(1, p * 10 - i));
      var inner = seg.firstChild;
      inner.style.transitionDelay = (i * 35) + 'ms';
      inner.style.transform = 'scaleX(' + f + ')';
      inner.style.opacity = f >= 1 ? 1 : 0.55;
      seg.classList.toggle('full', f >= 1);
    });
    document.getElementById('pct').textContent = Math.floor(p * 100) + '%';
    document.getElementById('paid').textContent = money(Math.round(paid * 100) / 100);
    document.getElementById('left').textContent = money(Math.max(Math.round((total - paid) * 100) / 100, 0));
    document.getElementById('undo').hidden = !st.payments.length;
    document.querySelector('.card').classList.toggle('done', total > 0 && paid >= total);
  }

  function addPayment() {
    var v = num(payIn.value);
    if (!v) { payIn.focus(); return; }
    st.payments.push(v); payIn.value = ''; save(); render();
  }

  document.getElementById('add').addEventListener('click', addPayment);
  payIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') addPayment(); });
  document.getElementById('undo').addEventListener('click', function () { st.payments.pop(); save(); render(); });
  totalIn.addEventListener('input', function () { st.total = totalIn.value; save(); render(); });
  onCurrency(render);
  render();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Read</title>
<script>
  // Tema: ?theme=dark o ?theme=light en el enlace; sin parámetro sigue el modo del sistema
  (function () {
    var p = new URLSearchParams(location.search).get('theme');
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function apply() { document.documentElement.dataset.theme = (p === 'dark' || p === 'light') ? p : (mq.matches ? 'dark' : 'light'); }
    apply();
    if (p !== 'dark' && p !== 'light' && mq.addEventListener) mq.addEventListener('change', apply);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --vanilla: #FAF7F2;
    --linen: #FFFFFF;
    --linen-soft: #FCFAF6;
    --espresso: #2E2620;
    --sage: #8A9A86;
    --rose: #D9A5B3;
    --muted: rgba(var(--ink-rgb), 0.4);
    --ink-rgb: 46, 38, 32;
    --shadow-rgb: 46, 38, 32;
    --sage-rgb: 138, 154, 134;
    --rose-rgb: 217, 165, 179;
    --sage-tint: #EEF1EC;
    --hover: #F2EEE7;
    --latte: #C8B39B;
  }
  :root[data-theme="dark"] {
    --vanilla: #26211D;
    --linen: #322B26;
    --bone: #201C19;
    --linen-soft: #201C19;
    --espresso: #EFE7DC;
    --sage: #A3B49E;
    --rose: #E2B3C0;
    --ink-rgb: 239, 231, 220;
    --shadow-rgb: 0, 0, 0;
    --sage-rgb: 163, 180, 158;
    --rose-rgb: 226, 179, 192;
    --sage-tint: #2F352D;
    --hover: #3A322C;
    --latte: #A88F75;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: transparent; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
    font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
    color: var(--espresso);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    width: 100%; max-width: 340px; min-width: 260px;
    height: 164px;
    background: var(--linen-soft);
    border-radius: 20px;
    box-shadow: 0 8px 28px rgba(var(--shadow-rgb), 0.06), inset 0 0 0 1px rgba(var(--ink-rgb), 0.035);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    overflow: hidden;
  }

  .brand {
    position: absolute; top: 12px; left: 18px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic; font-size: 16px; font-weight: 500;
    color: var(--espresso); opacity: 0.75;
    display: flex; align-items: center; gap: 6px;
  }
  .brand .leaf { font-style: normal; font-size: 13px; color: var(--sage); }
  .durations {
    position: absolute; top: 12px; right: 16px;
    display: flex; gap: 2px;
    transition: opacity 0.4s ease;
  }
  .durations button {
    border: none; background: transparent; cursor: pointer;
    font: inherit; font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em;
    color: var(--muted);
    padding: 3px 7px; border-radius: 999px;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .durations button.on { background: var(--vanilla); color: var(--espresso); }
  .running .durations { opacity: 0; pointer-events: none; }

  .time {
    cursor: pointer;
    font-size: 52px; font-weight: 300;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    padding-left: 0.08em;
    transition: color 0.6s ease;
  }
  .finished .time { color: var(--sage); }
  .time[contenteditable="true"] {
    outline: none; cursor: text;
    background: var(--vanilla); border-radius: 14px; padding: 4px 14px 4px calc(14px + 0.08em);
  }
  .hint { font-size: 10px; letter-spacing: 0.2em; color: var(--muted); margin-top: -2px; }
  .hint[hidden] { display: none; }

  .actions { display: flex; align-items: center; gap: 14px; }
  .word {
    border: none; background: transparent; cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 400;
    letter-spacing: 0.32em; text-transform: lowercase;
    color: var(--muted);
    padding: 6px 4px 6px calc(4px + 0.32em);
    border-radius: 999px;
    transition: color 0.25s ease;
  }
  .word:hover { color: var(--espresso); }
  .reset { font-size: 10.5px; letter-spacing: 0.24em; opacity: 0.8; }
  .reset[hidden] { display: none; }

  .progress {
    position: absolute; left: 0; bottom: 0;
    height: 2px; width: 0;
    background: var(--sage); opacity: 0.55;
    transition: width 1s linear;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="brand"><span class="leaf">❦</span>cozy read</div>
    <div class="durations" id="durations">
      <button type="button" data-min="20">20</button>
      <button type="button" data-min="30">30</button>
      <button type="button" id="custom">other</button>
    </div>
    <div class="time" id="time">20:00</div>
    <div class="hint" id="hint" hidden>minutes · enter to save</div>
    <div class="actions">
      <button class="word" id="toggle" type="button">start</button>
      <button class="word reset" id="reset" type="button" hidden>reset</button>
    </div>
    <div class="progress" id="progress"></div>
  </div>

<script>
  const KEY = 'cozy-timer-v1';
  const card = document.getElementById('card');
  const timeEl = document.getElementById('time');
  const toggle = document.getElementById('toggle');
  const resetBtn = document.getElementById('reset');
  const progress = document.getElementById('progress');
  const durBtns = [...document.querySelectorAll('[data-min]')];
  const customBtn = document.getElementById('custom');
  const hint = document.getElementById('hint');

  // state: minutes, remaining (ms), endAt (timestamp si está corriendo)
  let state = { minutes: 20, remaining: 20 * 60000, endAt: null };
  try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  let tick = null, audio = null;

  const fmt = (ms) => {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  };
  const left = () => state.endAt ? state.endAt - Date.now() : state.remaining;

  function render() {
    const ms = left();
    const total = state.minutes * 60000;
    if (timeEl.isContentEditable) return;
    timeEl.textContent = fmt(ms);
    document.title = state.endAt ? fmt(ms) + ' · Cozy Read' : 'Cozy Read';
    progress.style.width = ((1 - ms / total) * 100) + '%';
    card.classList.toggle('running', !!state.endAt);
    toggle.textContent = state.endAt ? 'pause' : (ms <= 0 ? 'again' : 'start');
    resetBtn.hidden = !!state.endAt || ms >= total || ms <= 0;
    durBtns.forEach(b => b.classList.toggle('on', Number(b.dataset.min) === state.minutes));
    const isCustom = state.minutes !== 20 && state.minutes !== 30;
    customBtn.classList.toggle('on', isCustom);
    customBtn.textContent = isCustom ? state.minutes : 'other';
  }

  function loop() {
    clearInterval(tick);
    tick = setInterval(() => {
      if (left() <= 0) finish(); else render();
    }, 250);
  }

  function start() {
    if (state.remaining <= 0) state.remaining = state.minutes * 60000;
    card.classList.remove('finished');
    state.endAt = Date.now() + state.remaining;
    save(); loop(); render();
  }
  function pause() {
    state.remaining = left();
    state.endAt = null;
    clearInterval(tick);
    save(); render();
  }
  function reset(minutes) {
    clearInterval(tick);
    if (minutes) state.minutes = minutes;
    state.remaining = state.minutes * 60000;
    state.endAt = null;
    card.classList.remove('finished');
    save(); render();
  }
  function finish() {
    clearInterval(tick);
    state.remaining = 0; state.endAt = null;
    save();
    card.classList.add('finished');
    render();
    chime();
  }

  // Campanita suave: tres notas senoidales con armónico, ataque lento y cola larga
  function ensureAudio() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  }
  function chime() {
    try {
      ensureAudio();
      const now = audio.currentTime + 0.05;
      const notes = [523.25, 659.25, 783.99]; // do, mi, sol
      notes.forEach((f, i) => {
        const t = now + i * 0.42;
        [[f, 0.12], [f * 2, 0.025]].forEach(([freq, peak]) => {
          const o = audio.createOscillator();
          const g = audio.createGain();
          o.type = 'sine'; o.frequency.value = freq;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(peak, t + 0.04);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
          o.connect(g).connect(audio.destination);
          o.start(t); o.stop(t + 2.5);
        });
      });
    } catch (e) {}
  }

  toggle.addEventListener('click', () => {
    ensureAudio(); // desbloquea el audio con el clic para que el pitido final suene
    state.endAt ? pause() : start();
  });
  resetBtn.addEventListener('click', () => reset());
  durBtns.forEach(b => b.addEventListener('click', () => reset(Number(b.dataset.min))));

  // Tiempo personalizado: toca "otro" o los números (en pausa) y escribe los minutos
  function editMinutes() {
    if (state.endAt) return;
    timeEl.contentEditable = 'true';
    timeEl.textContent = state.minutes;
    hint.hidden = false;
    timeEl.focus();
    document.getSelection().selectAllChildren(timeEl);
  }
  function commitMinutes() {
    if (!timeEl.isContentEditable) return;
    const v = parseInt(timeEl.textContent.replace(/\D/g, ''), 10);
    timeEl.contentEditable = 'false';
    hint.hidden = true;
    if (v > 0) reset(Math.min(180, v)); else render();
  }
  customBtn.addEventListener('click', editMinutes);
  timeEl.addEventListener('click', () => { if (!timeEl.isContentEditable) editMinutes(); });
  timeEl.addEventListener('blur', commitMinutes);
  timeEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); timeEl.blur(); }
    else if (e.key === 'Escape') { timeEl.textContent = state.minutes; timeEl.blur(); }
    else if (e.key.length === 1 && !/[0-9]/.test(e.key)) e.preventDefault();
  });

  // Si el widget se recarga a mitad de sesión, retoma donde iba
  if (state.endAt) {
    if (left() <= 0) { state.remaining = 0; state.endAt = null; save(); card.classList.add('finished'); }
    else loop();
  }
  render();
</script>
</body>
</html>

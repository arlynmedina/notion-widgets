<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFDF7;
    --butter: #FFF8E7;
    --butter-deep: #FBE7A8;
    --lavender: #C9B8E8;
    --lavender-soft: #F2EDFB;
    --lav-ink: #7C6A9E;
    --pink: #F7D6E0;
    --ink: #4B4453;
    --muted: #A79FAE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); overflow-x: hidden; }
  body {
    font-family: 'Outfit', system-ui, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 14px 12px;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 360px;
    background:
      radial-gradient(60% 40% at 15% 8%, rgba(247, 214, 224, 0.55), transparent 70%),
      radial-gradient(60% 40% at 90% 30%, rgba(201, 184, 232, 0.35), transparent 70%),
      var(--butter);
    border-radius: 24px;
    padding: 18px 16px 16px;
    box-shadow: 0 10px 30px rgba(201, 184, 232, 0.25);
    overflow: hidden;
  }
  .float { position: absolute; color: var(--lavender); font-size: 12px; animation: drift 5s ease-in-out infinite; pointer-events: none; }
  @keyframes drift { 50% { transform: translateY(-5px) rotate(12deg); } }

  .sub {
    display: flex; justify-content: center; align-items: center; gap: 6px;
    font-size: 10.5px; font-weight: 500; color: var(--lav-ink);
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .sub::before, .sub::after { content: '♡'; font-size: 10px; letter-spacing: 0; color: #E6A9BD; }
  .title-input {
    width: 100%; border: none; background: transparent;
    font: inherit; font-size: 18px; font-weight: 600; color: var(--ink);
    text-align: center; outline: none;
    padding: 3px 6px; margin-top: 4px; border-radius: 12px;
    transition: background 0.2s;
  }
  .title-input:focus { background: rgba(255,255,255,0.7); }
  .title-input::placeholder { color: var(--muted); font-weight: 400; }

  .ring-wrap { position: relative; width: 190px; max-width: 72%; margin: 12px auto 4px; aspect-ratio: 1; }
  .ring-wrap svg.ring { width: 100%; height: 100%; transform: rotate(-90deg); display: block; overflow: visible; }
  .track { fill: none; stroke: #FFFFFF; stroke-width: 14; }
  .dots { fill: none; stroke: rgba(201, 184, 232, 0.45); stroke-width: 1.5; stroke-dasharray: 1 6; stroke-linecap: round; }
  .bar { fill: none; stroke: url(#grad); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1); filter: drop-shadow(0 2px 4px rgba(185, 163, 227, 0.4)); }
  .mile { fill: #FFFFFF; stroke: #E9E1F6; stroke-width: 1.5; transition: fill 0.4s, stroke 0.4s; }
  .mile.on { fill: #FFE69A; stroke: #F3C969; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .face { width: 34px; height: 22px; margin-bottom: 2px; }
  .pct { font-size: 38px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
  .pct small { font-size: 17px; font-weight: 500; color: var(--muted); }
  .pages { font-size: 11.5px; color: var(--muted); margin-top: 5px; }

  .msg {
    margin: 8px auto 14px;
    font-size: 14px; font-weight: 500;
    background: #FFFFFF;
    color: var(--lav-ink);
    padding: 7px 16px;
    border-radius: 999px;
    width: fit-content; max-width: 100%;
    text-align: center;
    box-shadow: 0 3px 10px rgba(201, 184, 232, 0.25);
  }
  .msg.pop { animation: pop 0.5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform: scale(0.85); } 100% { transform: scale(1); } }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { background: rgba(255,255,255,0.85); border-radius: 18px; padding: 10px 14px; min-width: 0; border: 1.5px solid transparent; transition: border-color 0.2s; }
  .field:focus-within { border-color: var(--lavender); }
  .field label { display: block; font-size: 10px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .field input {
    width: 100%; border: none; outline: none;
    font: inherit; font-size: 21px; font-weight: 600; color: var(--ink);
    background: transparent; margin-top: 1px;
    -moz-appearance: textfield;
  }
  .field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .quick button {
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 9px 0; border-radius: 14px; border: none;
    background: var(--butter-deep); color: #7A6420;
    cursor: pointer;
    box-shadow: 0 3px 0 #F0D27E;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .quick button:active { transform: translateY(3px); box-shadow: 0 0 0 #F0D27E; }
  .quick button.lav { background: var(--lavender-soft); color: var(--lav-ink); box-shadow: 0 3px 0 #DDD2F0; }

  .timeline { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .tl { background: rgba(255,255,255,0.85); border-radius: 18px; padding: 9px 12px; min-width: 0; }
  .tl label { display: block; font-size: 10px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .tl input[type=date] {
    width: 100%; border: none; outline: none; background: transparent;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); margin-top: 3px; padding: 0;
  }
  .tl input[type=date]::-webkit-calendar-picker-indicator { opacity: 0.45; cursor: pointer; margin-left: 0; }
  .tl .days { font-size: 21px; font-weight: 700; color: var(--lav-ink); line-height: 1.15; margin-top: 1px; }
  .tl .days small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .tl.done { background: linear-gradient(135deg, #FFF3C9, #F2EDFB); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
  .foot .hint { font-size: 11px; color: var(--muted); }
  .newbook {
    font: inherit; font-size: 11.5px; font-weight: 500; color: var(--lav-ink);
    background: none; border: 1px dashed var(--lavender); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; white-space: nowrap;
  }
  .newbook.armed { background: var(--lavender-soft); border-style: solid; }
  .history { margin-top: 12px; border-top: 1.5px dashed rgba(201, 184, 232, 0.6); padding-top: 10px; }
  .history summary {
    list-style: none; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; font-weight: 600; color: var(--lav-ink);
  }
  .history summary::-webkit-details-marker { display: none; }
  .history summary .chev { transition: transform 0.25s; font-size: 11px; }
  .history[open] summary .chev { transform: rotate(90deg); }
  .history ul { list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .history li {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.85); border-radius: 16px; padding: 9px 10px 9px 12px;
  }
  .history .spine { flex: none; width: 8px; height: 34px; border-radius: 3px; }
  .history .info { flex: 1; min-width: 0; }
  .history .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history .m { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .history .m b { color: var(--lav-ink); font-weight: 600; }
  .history .del {
    flex: none; background: none; border: none; cursor: pointer;
    font: inherit; font-size: 11px; color: var(--muted); padding: 4px 6px; border-radius: 8px;
  }
  .history .del.armed { background: var(--pink); color: #9A4E66; }
  .history .empty { font-size: 11.5px; color: var(--muted); text-align: center; padding: 6px 0 2px; background: none; display: block; }
  .confetti { position: absolute; top: -10px; width: 7px; height: 10px; border-radius: 2px; pointer-events: none; animation: confetti 1.8s ease-in forwards; }
  @keyframes confetti { to { transform: translate(var(--dx), 420px) rotate(var(--r)); opacity: 0; } }
</style>
</head>
<body>
<main class="card" id="card">
  <span class="float" style="left:16px;top:58px">✦</span>
  <span class="float" style="right:22px;top:92px;animation-delay:1.2s;color:#E6A9BD">✿</span>
  <span class="float" style="left:30px;top:200px;animation-delay:2.4s;font-size:9px">✦</span>

  <div class="sub">currently reading</div>
  <input class="title-input" id="title" type="text" maxlength="60" placeholder="Book title ✎" aria-label="Book title">

  <div class="ring-wrap">
    <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#F8D57E"/>
          <stop offset="55%" stop-color="#F2B8CC"/>
          <stop offset="100%" stop-color="#B9A3E3"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="100" cy="100" r="84"/>
      <circle class="dots" cx="100" cy="100" r="68"/>
      <circle class="bar" id="bar" cx="100" cy="100" r="84"/>
      <g id="miles"></g>
    </svg>
    <div class="center">
      <svg class="face" viewBox="0 0 34 22" aria-hidden="true">
        <rect x="3" y="2" width="28" height="18" rx="4" fill="#C9B8E8"/>
        <rect x="16" y="2" width="2" height="18" fill="#B3A0DA"/>
        <g id="eyes" stroke="#4B4453" stroke-width="1.6" fill="none" stroke-linecap="round">
          <path d="M9 10 Q11 8 13 10"/><path d="M21 10 Q23 8 25 10"/>
        </g>
        <path d="M15 13.5 Q17 15.5 19 13.5" stroke="#4B4453" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <ellipse cx="9" cy="14" rx="2" ry="1.2" fill="#F2B8CC"/><ellipse cx="25" cy="14" rx="2" ry="1.2" fill="#F2B8CC"/>
      </svg>
      <div class="pct"><span id="pct">0</span><small>%</small></div>
      <div class="pages" id="pages">0 of 0 pages</div>
    </div>
  </div>

  <div class="msg" id="msg">Let's begin!</div>

  <div class="fields">
    <div class="field">
      <label for="current">Current page</label>
      <input id="current" type="number" inputmode="numeric" min="0" placeholder="0">
    </div>
    <div class="field">
      <label for="total">Total pages</label>
      <input id="total" type="number" inputmode="numeric" min="1" placeholder="300">
    </div>
  </div>
  <div class="quick">
    <button type="button" data-step="-1" class="lav">−1</button>
    <button type="button" data-step="1">+1</button>
    <button type="button" data-step="10">+10</button>
    <button type="button" data-step="25">+25</button>
  </div>

  <div class="timeline">
    <div class="tl">
      <label for="start">Started</label>
      <input id="start" type="date">
    </div>
    <div class="tl" id="dayTile">
      <label id="dayLabel">Reading for</label>
      <div class="days" id="days">–</div>
    </div>
  </div>
  <div class="foot">
    <span class="hint" id="finishedOn"></span>
    <button class="newbook" id="newBook" type="button">✿ New book</button>
  </div>

  <details class="history" id="history">
    <summary><span>📚 My reading history (<span id="histCount">0</span>)</span><span class="chev">▶</span></summary>
    <ul id="histList"></ul>
  </details>
</main>

<script>
  (function () {
    var KEY = 'notion-ring-v1';
    var state = { title: '', current: 0, total: 0, start: '', end: '' };
    try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
    function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

    var R = 84, C = 2 * Math.PI * R;
    var bar = document.getElementById('bar');
    var pctEl = document.getElementById('pct');
    var curIn = document.getElementById('current');
    var totIn = document.getElementById('total');
    var titleIn = document.getElementById('title');
    var msgEl = document.getElementById('msg');
    var card = document.getElementById('card');
    bar.style.strokeDasharray = C;
    bar.style.strokeDashoffset = C;

    // milestone dots at 25 / 50 / 75 %
    var milesEl = document.getElementById('miles'), miles = [25, 50, 75];
    miles.forEach(function (m) {
      var a = (m / 100) * 2 * Math.PI;
      var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', 100 + R * Math.cos(a));
      c.setAttribute('cy', 100 + R * Math.sin(a));
      c.setAttribute('r', 4.5);
      c.setAttribute('class', 'mile');
      c.dataset.m = m;
      milesEl.appendChild(c);
    });

    titleIn.value = state.title;
    if (state.current) curIn.value = state.current;
    if (state.total) totIn.value = state.total;

    function message(p, left) {
      if (!state.total) return 'Add your pages ✿';
      if (p >= 100) return 'Book finished! 🎉';
      if (p === 0) return "Let's begin! ♡";
      if (left <= 30) return 'Last ' + left + ' page' + (left === 1 ? '' : 's') + '!';
      if (p < 15) return 'Off to a cozy start ✨';
      if (p < 40) return 'Finding your rhythm ☁';
      if (p < 50) return 'Almost halfway!';
      if (p < 56) return 'Halfway there! ♡';
      if (p < 80) return 'Past the middle ✿';
      if (p < 92) return 'The final stretch 🌙';
      return 'Last few chapters!';
    }

    function confetti() {
      var colors = ['#F8D57E', '#F2B8CC', '#C9B8E8', '#BDE3D0', '#FFFFFF'];
      for (var i = 0; i < 36; i++) {
        var c = document.createElement('span');
        c.className = 'confetti';
        c.style.left = (Math.random() * 100) + '%';
        c.style.background = colors[i % colors.length];
        c.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
        c.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
        c.style.animationDelay = (Math.random() * 0.4) + 's';
        card.appendChild(c);
        setTimeout(c.remove.bind(c), 2400);
      }
    }

    var shown = 0, raf = null, lastMsg = '', wasDone = null;
    function animateNumber(to) {
      cancelAnimationFrame(raf);
      var from = shown, t0 = performance.now(), dur = 1000;
      (function step(t) {
        var k = Math.min((t - t0) / dur, 1);
        shown = from + (to - from) * (1 - Math.pow(1 - k, 3));
        if (k < 1) { pctEl.textContent = Math.round(shown); raf = requestAnimationFrame(step); }
        else { shown = to; pctEl.textContent = Number.isInteger(to) ? to : to.toFixed(1); }
      })(t0);
    }

    function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function parse(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function daysBetween(a, b) { return Math.round((parse(b) - parse(a)) / 86400000) + 1; }   // inclusive: same day = day 1
    function pretty(k) { var d = parse(k); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }

    function renderDays(done) {
      var today = ymd(new Date());
      if (!state.start && state.current > 0) state.start = today;        // the clock starts with your first page
      if (done && !state.end) state.end = today;
      if (!done && state.end) state.end = '';
      startIn.value = state.start || '';
      startIn.max = today;
      var tile = document.getElementById('dayTile');
      tile.classList.toggle('done', !!state.end);
      if (!state.start) {
        document.getElementById('dayLabel').textContent = 'Reading for';
        document.getElementById('days').innerHTML = '<small>not started</small>';
        document.getElementById('finishedOn').textContent = 'The day count starts on page 1';
      } else if (state.end) {
        var n = Math.max(1, daysBetween(state.start, state.end));
        document.getElementById('dayLabel').textContent = 'Finished in';
        document.getElementById('days').innerHTML = n + ' <small>day' + (n === 1 ? '' : 's') + ' ♡</small>';
        document.getElementById('finishedOn').textContent = 'Finished ' + pretty(state.end);
      } else {
        var d = Math.max(1, daysBetween(state.start, today));
        document.getElementById('dayLabel').textContent = 'Reading for';
        document.getElementById('days').innerHTML = d + ' <small>day' + (d === 1 ? '' : 's') + '</small>';
        document.getElementById('finishedOn').textContent = 'Day ' + d + ' with this book';
      }
    }

    function render() {
      var total = Math.max(0, state.total | 0);
      var cur = Math.min(Math.max(0, state.current | 0), total || Infinity);
      var raw = total ? (cur / total) * 100 : 0;
      var p = Math.round(raw * 10) / 10;
      bar.style.strokeDashoffset = C * (1 - Math.min(raw, 100) / 100);
      animateNumber(p);
      document.getElementById('pages').textContent = cur + ' of ' + total + ' pages';
      Array.prototype.forEach.call(milesEl.children, function (c) { c.classList.toggle('on', raw >= +c.dataset.m); });
      document.getElementById('eyes').innerHTML = p >= 100
        ? '<path d="M11 7.5 l0.9 1.8 2 .3-1.4 1.4.3 2-1.8-.9-1.8.9.3-2-1.4-1.4 2-.3z" fill="#F3C969" stroke="none"/><path d="M23 7.5 l0.9 1.8 2 .3-1.4 1.4.3 2-1.8-.9-1.8.9.3-2-1.4-1.4 2-.3z" fill="#F3C969" stroke="none"/>'
        : '<path d="M9 10 Q11 8 13 10"/><path d="M21 10 Q23 8 25 10"/>';
      var m = message(p, total - cur);
      msgEl.textContent = m;
      if (m !== lastMsg) { msgEl.classList.remove('pop'); void msgEl.offsetWidth; msgEl.classList.add('pop'); lastMsg = m; }
      var done = total > 0 && p >= 100;
      if (done && wasDone === false) confetti();
      wasDone = done;
      renderDays(done);
      save();
    }

    function clampCurrent() {
      if (state.total && state.current > state.total) { state.current = state.total; curIn.value = state.total; }
      if (state.current < 0) { state.current = 0; curIn.value = 0; }
    }

    curIn.addEventListener('input', function () { state.current = parseInt(curIn.value, 10) || 0; save(); render(); });
    curIn.addEventListener('change', function () { clampCurrent(); save(); render(); });
    totIn.addEventListener('input', function () { state.total = parseInt(totIn.value, 10) || 0; save(); render(); });
    totIn.addEventListener('change', function () { clampCurrent(); save(); render(); });
    titleIn.addEventListener('input', function () { state.title = titleIn.value; save(); });

    document.querySelector('.quick').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      state.current = (state.current | 0) + (+b.dataset.step);
      clampCurrent();
      curIn.value = state.current;
      save(); render();
    });

    var startIn = document.getElementById('start');
    startIn.addEventListener('change', function () {
      var today = ymd(new Date());
      state.start = startIn.value && startIn.value <= today ? startIn.value : (startIn.value ? today : '');
      if (state.end && state.start > state.end) state.start = state.end;
      save(); render();
    });

    // ---------- reading history (past books) ----------
    var HKEY = 'notion-ring-history-v1';
    var history = [];
    try { history = JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) {}
    function saveHistory() { try { localStorage.setItem(HKEY, JSON.stringify(history)); } catch (e) {} }
    var SPINES = ['#F8D57E', '#F2B8CC', '#C9B8E8', '#BDE3D0', '#F6C9A8'];

    function renderHistory() {
      var list = document.getElementById('histList');
      document.getElementById('histCount').textContent = history.length;
      list.innerHTML = '';
      if (!history.length) {
        list.innerHTML = '<li class="empty">Books you finish or set aside will live here ♡</li>';
        return;
      }
      history.forEach(function (b, i) {
        var li = document.createElement('li');
        var pct = b.total ? Math.min(100, Math.round(b.current / b.total * 100)) : 0;
        var meta;
        if (b.end) {
          var n = Math.max(1, daysBetween(b.start || b.end, b.end));
          meta = '<b>' + n + ' day' + (n === 1 ? '' : 's') + '</b> · ' + b.total + ' pages · ' + pretty(b.end);
        } else {
          var last = b.shelved || ymd(new Date());
          var d = b.start ? Math.max(1, daysBetween(b.start, last)) : 0;
          meta = 'set aside at <b>' + pct + '%</b>' + (d ? ' · ' + d + ' day' + (d === 1 ? '' : 's') : '') + ' · ' + pretty(last);
        }
        li.innerHTML = '<span class="spine" style="background:' + SPINES[i % SPINES.length] + '"></span>' +
          '<div class="info"><div class="t"></div><div class="m">' + (b.end ? '✓ finished in ' : '') + meta + '</div></div>' +
          '<button class="del" type="button" aria-label="Remove from history">✕</button>';
        li.querySelector('.t').textContent = b.title || 'Untitled book';
        var del = li.querySelector('.del'), t;
        del.addEventListener('click', function () {
          if (!del.classList.contains('armed')) {
            del.classList.add('armed'); del.textContent = 'remove?';
            t = setTimeout(function () { del.classList.remove('armed'); del.textContent = '✕'; }, 2500);
            return;
          }
          clearTimeout(t);
          history.splice(i, 1); saveHistory(); renderHistory();
        });
        list.appendChild(li);
      });
    }

    // two-tap "new book": the current book moves into your history (no browser dialogs inside Notion)
    var newBtn = document.getElementById('newBook'), armTimer;
    newBtn.addEventListener('click', function () {
      if (!newBtn.classList.contains('armed')) {
        newBtn.classList.add('armed'); newBtn.textContent = 'Tap again to shelve it';
        armTimer = setTimeout(function () { newBtn.classList.remove('armed'); newBtn.textContent = '✿ New book'; }, 2500);
        return;
      }
      clearTimeout(armTimer);
      newBtn.classList.remove('armed'); newBtn.textContent = '✿ New book';
      if (state.title || state.current > 0) {
        history.unshift({ title: state.title, current: state.current, total: state.total, start: state.start, end: state.end, shelved: ymd(new Date()) });
        saveHistory(); renderHistory();
      }
      state = { title: '', current: 0, total: 0, start: '', end: '' };
      titleIn.value = ''; curIn.value = ''; totIn.value = '';
      wasDone = null;
      save(); render();
      titleIn.focus();
    });

    renderHistory();
    requestAnimationFrame(render);
  })();
</script>
</body>
</html>

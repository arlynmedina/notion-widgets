<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookshelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1E1A17;
    --wood: #3A2C21;
    --wood-dark: #1A130E;
    --gold: #C4A265;
    --gold-bright: #F0D28C;
    --muted: #8C7A64;
    --line: rgba(196, 162, 101, 0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); overflow-x: hidden; }
  body {
    font-family: 'Playfair Display', Georgia, serif;
    color: var(--gold);
    display: flex;
    justify-content: center;
    padding: 14px 12px;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 360px;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 16px 16px;
    background:
      radial-gradient(90% 60% at 50% 38%, rgba(240, 190, 110, 0.10), transparent 70%),
      linear-gradient(180deg, #241E1A, var(--bg));
    overflow: hidden;
  }
  .card::before {                     /* inner frame */
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(196, 162, 101, 0.10);
    border-radius: 13px;
    pointer-events: none;
  }

  header { text-align: center; position: relative; }
  .eyebrow { font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.34em; color: var(--muted); }
  h1 { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500; font-size: 24px; color: var(--gold-bright); margin-top: 2px; }
  .flourish { width: 120px; height: 12px; margin: 2px auto 0; display: block; }

  /* fairy lights */
  .lights { position: relative; height: 26px; margin: 6px -4px 0; }
  .lights svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bulb {
    position: absolute;
    width: 6px; height: 6px; border-radius: 50%;
    background: #FFD98A;
    box-shadow: 0 0 6px 2px rgba(255, 210, 120, 0.55);
    animation: twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle { 50% { opacity: 0.35; box-shadow: 0 0 2px 1px rgba(255, 210, 120, 0.3); } }

  .shelf { display: flex; align-items: flex-end; gap: 6px; padding: 0 4px; }
  .books { flex: 1; min-width: 0; display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 128px; }
  .book {
    flex: 1 1 0;
    min-width: 0;
    max-width: 24px;
    border-radius: 4px 4px 1px 1px;
    border: none;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 9px 0 7px;
    background: var(--c);
    box-shadow: inset -3px 0 0 rgba(0,0,0,0.22), inset 2px 0 0 rgba(255,255,255,0.07);
    transition: transform 0.5s cubic-bezier(.2,1.4,.4,1), filter 0.4s, box-shadow 0.4s, background 0.4s;
    -webkit-tap-highlight-color: transparent;
  }
  .book.lean { transform: rotate(-7deg); transform-origin: bottom left; }
  .book:hover { transform: translateY(-5px); }
  .book.lean:hover { transform: rotate(-7deg) translateY(-5px); }
  .book:focus-visible { outline: 1px dashed var(--gold-bright); outline-offset: 3px; }
  .book .band { width: 100%; height: 3px; background: rgba(240, 210, 140, 0.35); }
  .book .label {
    width: 58%;
    height: 22%;
    border-radius: 2px;
    background: rgba(240, 220, 180, 0.18);
    display: grid;
    place-items: center;
    font-size: 8px;
    color: rgba(255, 240, 210, 0.75);
    font-family: 'Cinzel', serif;
    transition: color 0.4s, background 0.4s;
  }
  .book.done {
    background: linear-gradient(90deg, #B98F49 0%, #F3D99A 45%, #C29A55 100%);
    box-shadow: 0 0 16px rgba(240, 210, 140, 0.45), inset -3px 0 0 rgba(120, 80, 30, 0.25);
    transform: translateY(-12px);
  }
  .book.lean.done { transform: rotate(-7deg) translateY(-12px); }
  .book.done .band { background: rgba(110, 72, 30, 0.45); }
  .book.done .label { background: rgba(110, 72, 30, 0.18); color: #6E4A1E; }
  .book.done .label::after { content: '★'; font-size: 9px; }
  .book.done .label span { display: none; }

  .spark {
    position: absolute;
    left: 50%; top: 10%;
    font-size: 10px;
    color: var(--gold-bright);
    pointer-events: none;
    animation: spark 0.9s ease-out forwards;
  }
  @keyframes spark {
    0% { opacity: 1; transform: translate(-50%, 0) scale(0.6); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), var(--dy)) scale(1.2) rotate(90deg); }
  }

  .deco { flex: none; width: 24px; display: flex; justify-content: center; }
  .deco svg { display: block; }
  .flame { transform-origin: 50% 100%; animation: flicker 1.4s ease-in-out infinite alternate; }
  @keyframes flicker { 0% { transform: scale(1, 1) rotate(-2deg); } 50% { transform: scale(0.9, 1.08) rotate(2deg); } 100% { transform: scale(1.05, 0.95) rotate(-1deg); } }
  .glow { animation: glow 1.4s ease-in-out infinite alternate; }
  @keyframes glow { to { opacity: 0.5; } }

  .plank {
    height: 13px;
    margin: 0 -2px;
    border-radius: 3px;
    background: linear-gradient(180deg, #5A4331 0%, var(--wood) 45%, var(--wood-dark) 100%);
    box-shadow: 0 8px 14px rgba(0,0,0,0.5);
    position: relative;
  }
  .plank::after { content: ''; position: absolute; left: 10%; right: 10%; top: 3px; height: 1px; background: rgba(255, 220, 160, 0.12); }

  .counter { text-align: center; margin-top: 18px; }
  .big { font-family: 'Cinzel', serif; font-weight: 700; font-size: 30px; color: var(--gold-bright); letter-spacing: 0.02em; }
  .big span { color: var(--muted); font-weight: 500; font-size: 20px; }
  .sub { font-style: italic; font-size: 13px; margin-top: 1px; }
  .stars { display: flex; justify-content: center; gap: 5px; margin-top: 10px; font-size: 11px; }
  .stars i { font-style: normal; color: rgba(196, 162, 101, 0.25); transition: color 0.4s, transform 0.4s; }
  .stars i.on { color: var(--gold-bright); transform: scale(1.15); }

  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 8px; }
  .msg { font-style: italic; font-size: 12px; color: var(--muted); }
  .reset {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: 'Cinzel', serif;
    font-size: 8.5px;
    letter-spacing: 0.18em;
    padding: 5px 9px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.2s, border-color 0.2s;
  }
  .reset:hover, .reset.armed { color: var(--gold-bright); border-color: var(--gold); }
</style>
</head>
<body>
<main class="card">
  <header>
    <div class="eyebrow">EX LIBRIS · <span id="year"></span></div>
    <h1>My Bookshelf</h1>
    <svg class="flourish" viewBox="0 0 120 12" aria-hidden="true">
      <path d="M2 6 H48 M72 6 H118" stroke="#8C7A64" stroke-width="0.8"/>
      <path d="M60 1 L63 6 L60 11 L57 6 Z" fill="#C4A265"/>
      <circle cx="52" cy="6" r="1.3" fill="#C4A265"/><circle cx="68" cy="6" r="1.3" fill="#C4A265"/>
    </svg>
  </header>

  <div class="lights" id="lights" aria-hidden="true">
    <svg viewBox="0 0 100 26" preserveAspectRatio="none"><path d="M0 4 Q25 22 50 8 T100 4" fill="none" stroke="#5E4C3A" stroke-width="0.6" vector-effect="non-scaling-stroke"/></svg>
  </div>

  <div class="shelf">
    <div class="deco" aria-hidden="true">
      <svg width="20" height="52" viewBox="0 0 20 52">
        <ellipse class="glow" cx="10" cy="12" rx="9" ry="11" fill="rgba(255,200,110,0.18)"/>
        <path class="flame" d="M10 4 C13 9 13 13 10 16 C7 13 7 9 10 4 Z" fill="#FFC86E"/>
        <path class="flame" d="M10 9 C11.5 11.5 11.5 13 10 14.5 C8.5 13 8.5 11.5 10 9 Z" fill="#FFF0C8"/>
        <line x1="10" y1="16" x2="10" y2="19" stroke="#3A2C21" stroke-width="1"/>
        <rect x="5" y="19" width="10" height="27" rx="2" fill="#EADBC0"/>
        <path d="M5 23 Q7 25 8 23" fill="none" stroke="#D9C6A2" stroke-width="1"/>
        <rect x="2" y="45" width="16" height="4" rx="2" fill="#B08D4F"/>
      </svg>
    </div>
    <div class="books" id="books" role="group" aria-label="This year's books"></div>
    <div class="deco" aria-hidden="true">
      <svg width="24" height="48" viewBox="0 0 24 48">
        <path d="M12 30 C10 22 4 20 2 14 C8 14 11 20 12 26" fill="#6F8A5A"/>
        <path d="M12 30 C13 20 20 18 22 11 C15 12 13 19 12 26" fill="#88A06C"/>
        <path d="M12 30 C11 20 13 12 12 4 C15 10 15 20 12 26" fill="#7A9663"/>
        <path d="M4 30 H20 L18 46 H6 Z" fill="#B5775A"/>
        <rect x="3" y="29" width="18" height="4" rx="1.5" fill="#C98A6B"/>
      </svg>
    </div>
  </div>
  <div class="plank"></div>

  <div class="counter">
    <div class="big"><b id="count">0</b><span> / 10</span></div>
    <div class="sub">books finished this year</div>
    <div class="stars" id="stars" aria-hidden="true"></div>
  </div>

  <footer>
    <span class="msg" id="msg">Tap a spine when you finish it</span>
    <button class="reset" id="reset" type="button">RESET</button>
  </footer>
</main>

<script>
  (function () {
    var TOTAL = 10;
    var year = new Date().getFullYear();
    var KEY = 'notion-shelf-' + year;
    var heights = [88, 76, 98, 82, 94, 72, 90, 100, 80, 86];
    var colors = ['#6B2E2E', '#2F4A3A', '#3B3F5C', '#7A5A2E', '#5A3348', '#2E4650', '#704036', '#46522F', '#4A3A5E', '#6A4A2A'];
    var numerals = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
    var messages = [
      'Tap a spine when you finish it',
      'A lovely beginning ✦',
      'Your library is growing',
      'Reading like a scholar',
      'Almost a full shelf!',
      'A full shelf. Bravo! ✦'
    ];

    function load() {
      try {
        var d = JSON.parse(localStorage.getItem(KEY));
        if (Array.isArray(d) && d.length === TOTAL) return d;
      } catch (e) {}
      return new Array(TOTAL).fill(false);
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

    var state = load();
    var booksEl = document.getElementById('books');
    var starsEl = document.getElementById('stars');
    document.getElementById('year').textContent = year;

    // fairy lights
    var lights = document.getElementById('lights');
    for (var i = 0; i < 9; i++) {
      var x = 5 + i * 11.25;
      // point on the garland curve (two quadratic béziers, x is linear in t)
      var t = x < 50 ? x / 50 : (x - 50) / 50;
      var y = x < 50
        ? (1 - t) * (1 - t) * 4 + 2 * t * (1 - t) * 22 + t * t * 8
        : (1 - t) * (1 - t) * 8 + 2 * t * (1 - t) * -6 + t * t * 4;
      var bulb = document.createElement('span');
      bulb.className = 'bulb';
      bulb.style.left = 'calc(' + x + '% - 3px)';
      bulb.style.top = (y - 1) + 'px';
      bulb.style.animationDelay = (i * 0.37) + 's';
      lights.appendChild(bulb);
    }

    for (var s = 0; s < TOTAL; s++) starsEl.appendChild(document.createElement('i')).textContent = '✦';

    function render() {
      var n = state.filter(Boolean).length;
      document.getElementById('count').textContent = n;
      Array.prototype.forEach.call(starsEl.children, function (st, i) { st.classList.toggle('on', i < n); });
      var idx = n === 0 ? 0 : n === TOTAL ? 5 : n < 3 ? 1 : n < 5 ? 2 : n < 8 ? 3 : 4;
      document.getElementById('msg').textContent = messages[idx];
    }

    function sparkle(el) {
      for (var k = 0; k < 6; k++) {
        var sp = document.createElement('span');
        sp.className = 'spark';
        sp.textContent = k % 2 ? '✦' : '·';
        var ang = Math.random() * Math.PI - Math.PI;
        sp.style.setProperty('--dx', Math.cos(ang) * 22 + 'px');
        sp.style.setProperty('--dy', Math.sin(ang) * 26 - 6 + 'px');
        el.appendChild(sp);
        setTimeout(sp.remove.bind(sp), 950);
      }
    }

    numerals.forEach(function (num, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'book' + (i === 9 ? ' lean' : '') + (state[i] ? ' done' : '');
      b.style.height = heights[i] + '%';
      b.style.setProperty('--c', colors[i]);
      b.setAttribute('aria-pressed', state[i]);
      b.setAttribute('aria-label', 'Book ' + (i + 1));
      b.innerHTML = '<span class="band"></span><span class="label"><span>' + num + '</span></span><span class="band"></span>';
      b.addEventListener('click', function () {
        state[i] = !state[i];
        b.classList.toggle('done', state[i]);
        b.setAttribute('aria-pressed', state[i]);
        if (state[i]) sparkle(b);
        save(); render();
      });
      booksEl.appendChild(b);
    });

    // two-tap reset (no browser dialogs inside Notion)
    var resetBtn = document.getElementById('reset'), armTimer;
    resetBtn.addEventListener('click', function () {
      if (!resetBtn.classList.contains('armed')) {
        resetBtn.classList.add('armed');
        resetBtn.textContent = 'SURE?';
        armTimer = setTimeout(function () { resetBtn.classList.remove('armed'); resetBtn.textContent = 'RESET'; }, 2500);
        return;
      }
      clearTimeout(armTimer);
      resetBtn.classList.remove('armed'); resetBtn.textContent = 'RESET';
      state = new Array(TOTAL).fill(false);
      save();
      Array.prototype.forEach.call(booksEl.children, function (b) { b.classList.remove('done'); b.setAttribute('aria-pressed', false); });
      render();
    });

    render();
  })();
</script>
</body>
</html>

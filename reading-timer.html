<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Reading Timer</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap");

  :root {
    --cream: #FDFBF7;
    --card: #FFFFFF;
    --sage: #8A9A86;
    --sage-soft: #E6EBE4;
    --latte: #A38560;
    --latte-soft: #F2EBE1;
    --ink: #4A4238;
    --muted: #9C9286;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--cream);
  }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(163, 133, 96, 0.14), 0 1px 3px rgba(74, 66, 56, 0.06);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  /* Editable numbers: look like text, with a dashed underline as the hint */
  .num {
    font: inherit;
    color: inherit;
    text-align: center;
    background: transparent;
    border: none;
    border-bottom: 1.5px dashed rgba(163, 133, 96, 0.5);
    border-radius: 0;
    padding: 0;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .num::-webkit-outer-spin-button,
  .num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .num:hover { border-bottom-color: var(--latte); }
  .num:focus { outline: none; border-bottom: 1.5px solid var(--latte); background: var(--latte-soft); }
  .num:disabled { border-bottom-color: transparent; }

  /* Timer row */
  .top { display: flex; align-items: center; gap: 12px; }
  .cup { width: 64px; height: 64px; flex-shrink: 0; }
  .timer-info { flex: 1; min-width: 0; }
  .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .label .num { width: 3.2ch; font-weight: 700; color: var(--latte); letter-spacing: 0; }
  .time {
    font-size: 40px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .status { font-size: 11px; color: var(--sage); min-height: 14px; }

  /* Buttons */
  .controls { display: flex; gap: 6px; }
  .btn {
    flex: 1;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 0;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease, opacity 0.2s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.45; cursor: default; transform: none; }
  .btn-start { background: var(--sage); color: #fff; }
  .btn-start:not(:disabled):hover { background: #7A8A76; }
  .btn-pause { background: var(--latte); color: #fff; }
  .btn-pause:not(:disabled):hover { background: #937652; }
  .btn-reset { background: var(--latte-soft); color: var(--latte); }
  .btn-reset:hover { background: #EADFD0; }

  /* Page counter */
  .pages {
    background: var(--sage-soft);
    border-radius: 12px;
    padding: 6px 8px 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .pages-row { display: flex; align-items: center; justify-content: space-between; }
  .pages-label { font-size: 12px; font-weight: 600; color: var(--ink); }
  .counter { display: flex; align-items: center; gap: 6px; }
  .count {
    width: 3.5ch;
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .round {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: var(--card);
    color: var(--sage);
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 1px 3px rgba(74, 66, 56, 0.1);
    transition: transform 0.12s ease;
  }
  .round:active { transform: scale(0.9); }
  .bump { animation: bump 0.25s ease; }
  @keyframes bump { 50% { transform: scale(1.2); } }

  .goal-row { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--muted); }
  .bar { flex: 1; height: 6px; background: var(--card); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--sage); border-radius: 99px; transition: width 0.3s ease, background 0.3s ease; }
  .fill.done { background: var(--latte); }
  .goal-row .num { width: 3.5ch; font-weight: 700; color: var(--ink); }

  /* Cup animation */
  .steam path {
    fill: none;
    stroke: var(--sage);
    stroke-width: 2.2;
    stroke-linecap: round;
    opacity: 0;
  }
  .running .steam path { animation: steam 2.4s ease-in-out infinite; }
  .running .steam path:nth-child(2) { animation-delay: 0.8s; }
  .running .steam path:nth-child(3) { animation-delay: 1.6s; }
  @keyframes steam {
    0%   { opacity: 0;   transform: translateY(4px); }
    40%  { opacity: 0.8; }
    100% { opacity: 0;   transform: translateY(-8px); }
  }
  .running .mug { animation: wobble 3s ease-in-out infinite; transform-origin: 32px 56px; }
  @keyframes wobble {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-2deg); }
    75% { transform: rotate(2deg); }
  }
  button:focus-visible { outline: 2px solid var(--latte); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .running .steam path, .running .mug { animation: none; opacity: 0.7; }
  }
</style>
</head>
<body>
  <main class="card">
    <section class="top">
      <svg class="cup" id="cup" viewBox="0 0 64 64" aria-hidden="true">
        <g class="steam">
          <path d="M24 22 q-3 -4 0 -8 q3 -4 0 -8" />
          <path d="M32 22 q-3 -4 0 -8 q3 -4 0 -8" />
          <path d="M40 22 q-3 -4 0 -8 q3 -4 0 -8" />
        </g>
        <g class="mug">
          <ellipse cx="32" cy="57" rx="22" ry="3" fill="#F2EBE1" />
          <path d="M48 32 h3 a7 7 0 0 1 0 14 h-4" fill="none" stroke="#A38560" stroke-width="3.5" />
          <path d="M14 26 h36 v16 a14 14 0 0 1 -14 14 h-8 a14 14 0 0 1 -14 -14 z" fill="#A38560" />
          <ellipse cx="32" cy="26" rx="18" ry="3.5" fill="#C9B08F" />
          <path d="M26 40 c0 -3 6 -3 6 0 c0 -3 6 -3 6 0 c0 4 -6 7 -6 7 c0 0 -6 -3 -6 -7 z" fill="#8A9A86" />
        </g>
      </svg>
      <div class="timer-info">
        <div class="label">Reading ·
          <input class="num" id="minutes" type="number" inputmode="numeric" min="1" max="180" value="25" aria-label="Session length in minutes" title="Click to change the session length"> min
        </div>
        <div class="time" id="time" role="timer" aria-live="off">25:00</div>
        <div class="status" id="status">Ready when you are ☕</div>
      </div>
    </section>

    <section class="controls">
      <button class="btn btn-start" id="start">Start</button>
      <button class="btn btn-pause" id="pause" disabled>Pause</button>
      <button class="btn btn-reset" id="reset">Reset</button>
    </section>

    <section class="pages">
      <div class="pages-row">
        <span class="pages-label">📖 Pages read today</span>
        <div class="counter">
          <button class="round" id="minus" aria-label="Remove a page">−</button>
          <input class="num count" id="count" type="number" inputmode="numeric" min="0" max="9999" value="0" aria-label="Pages read today" title="Click to type a number">
          <button class="round" id="plus" aria-label="Add a page">+</button>
        </div>
      </div>
      <div class="goal-row">
        <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
        <span>goal <input class="num" id="goal" type="number" inputmode="numeric" min="1" max="9999" value="20" aria-label="Daily page goal" title="Click to change your daily goal"></span>
      </div>
    </section>
  </main>

<script>
(function () {
  var PAGES_KEY = 'cozyReading.pages';
  var SETTINGS_KEY = 'cozyReading.settings';

  var timeEl = document.getElementById('time');
  var statusEl = document.getElementById('status');
  var cupEl = document.getElementById('cup');
  var startBtn = document.getElementById('start');
  var pauseBtn = document.getElementById('pause');
  var resetBtn = document.getElementById('reset');
  var minutesEl = document.getElementById('minutes');
  var countEl = document.getElementById('count');
  var goalEl = document.getElementById('goal');
  var fillEl = document.getElementById('fill');

  // ---------- Storage helpers ----------
  function read(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
  }
  function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

  var settings = read(SETTINGS_KEY) || {};
  var minutes = clamp(parseInt(settings.minutes, 10) || 25, 1, 180);
  var goal = clamp(parseInt(settings.goal, 10) || 20, 1, 9999);
  function saveSettings() { write(SETTINGS_KEY, { minutes: minutes, goal: goal }); }

  // Pressing Enter in any number box confirms it
  document.querySelectorAll('.num').forEach(function (el) {
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.blur(); });
    el.addEventListener('focus', function () { el.select(); });
  });

  // ---------- Timer ----------
  var remaining = minutes * 60;
  var endTime = null;
  var tick = null;

  function format(s) {
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function render() { timeEl.textContent = format(remaining); }

  function setRunning(isRunning) {
    cupEl.classList.toggle('running', isRunning);
    startBtn.disabled = isRunning;
    pauseBtn.disabled = !isRunning;
    minutesEl.disabled = isRunning;
  }

  function start() {
    if (tick) return;
    if (remaining <= 0) remaining = minutes * 60;
    endTime = Date.now() + remaining * 1000;
    tick = setInterval(update, 250);
    setRunning(true);
    statusEl.textContent = 'Cozy reading time…';
    update();
  }

  function pause() {
    if (!tick) return;
    clearInterval(tick);
    tick = null;
    setRunning(false);
    startBtn.textContent = 'Resume';
    statusEl.textContent = 'Paused, take a sip';
  }

  function reset() {
    clearInterval(tick);
    tick = null;
    remaining = minutes * 60;
    setRunning(false);
    startBtn.textContent = 'Start';
    statusEl.textContent = 'Ready when you are ☕';
    render();
  }

  function update() {
    remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
    render();
    if (remaining === 0) finish();
  }

  function finish() {
    clearInterval(tick);
    tick = null;
    setRunning(false);
    startBtn.textContent = 'Start';
    statusEl.textContent = 'Session done! Time for a break 🌿';
    chime();
  }

  function chime() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      [523.25, 659.25, 783.99].forEach(function (freq, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        var t = ctx.currentTime + i * 0.18;
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.65);
      });
    } catch (e) { /* sound is optional */ }
  }

  // Changing the length resets the timer to the new length
  minutesEl.addEventListener('change', function () {
    minutes = clamp(parseInt(minutesEl.value, 10) || minutes, 1, 180);
    minutesEl.value = minutes;
    saveSettings();
    reset();
  });

  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  resetBtn.addEventListener('click', reset);

  // ---------- Pages counter (resets each new day) ----------
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  var saved = read(PAGES_KEY);
  var pages = saved && saved.date === today() ? clamp(parseInt(saved.count, 10) || 0, 0, 9999) : 0;
  var pagesDate = today();

  function renderGoal() {
    var pct = Math.min(100, Math.round(pages / goal * 100));
    fillEl.style.width = pct + '%';
    fillEl.classList.toggle('done', pages >= goal);
  }

  function setPages(n, animate) {
    // Start a fresh count if the day changed while the page was open
    if (pagesDate !== today()) { pagesDate = today(); }
    var wasBelow = pages < goal;
    pages = clamp(n, 0, 9999);
    write(PAGES_KEY, { date: pagesDate, count: pages });
    if (document.activeElement !== countEl) countEl.value = pages;
    renderGoal();
    if (wasBelow && pages >= goal && !tick) statusEl.textContent = 'Daily goal reached! 🎉';
    if (animate) {
      countEl.classList.remove('bump');
      void countEl.offsetWidth; // restart animation
      countEl.classList.add('bump');
    }
  }

  function step(delta) {
    var base = pagesDate !== today() ? 0 : pages;
    setPages(base + delta, true);
  }

  document.getElementById('plus').addEventListener('click', function () { step(1); });
  document.getElementById('minus').addEventListener('click', function () { step(-1); });

  // Typed numbers save as you type and tidy up when you leave the box
  countEl.addEventListener('input', function () {
    var n = parseInt(countEl.value, 10);
    if (!isNaN(n)) setPages(n, false);
  });
  countEl.addEventListener('change', function () { countEl.value = pages; });

  goalEl.addEventListener('change', function () {
    goal = clamp(parseInt(goalEl.value, 10) || goal, 1, 9999);
    goalEl.value = goal;
    saveSettings();
    renderGoal();
  });

  // ---------- Initial render ----------
  minutesEl.value = minutes;
  goalEl.value = goal;
  countEl.value = pages;
  renderGoal();
  render();
})();
</script>
</body>
</html>

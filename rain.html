<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainy Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F9FA;
    --card: #FFFFFF;
    --slate: #4A5560;
    --slate-soft: #8E98A2;
    --line: #E8ECEF;
    --matcha: #7E9A7B;
    --matcha-soft: #EBF1EA;
    --sky: #EEF2F5;
    --blush: #F4D9D4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); overflow-x: hidden; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    color: var(--slate);
    display: flex;
    justify-content: center;
    padding: 14px 12px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 18px 16px 16px;
    box-shadow: 0 6px 24px rgba(74, 85, 96, 0.06);
  }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--slate-soft); }
  h1 { font-size: 17px; font-weight: 700; margin-top: 2px; letter-spacing: -0.01em; }
  .pill {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--slate-soft);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 9px;
    display: flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #CBD2D8; }
  .playing .pill { color: var(--matcha); border-color: #D6E2D4; background: var(--matcha-soft); }
  .playing .pill .dot { background: var(--matcha); animation: breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.3; } }

  /* ---------- little scene ---------- */
  .scene {
    position: relative;
    height: 128px;
    margin: 14px 0 16px;
    border-radius: 18px;
    background: linear-gradient(180deg, #E9EEF2 0%, #F5F7F8 100%);
    overflow: hidden;
  }
  .cloud {
    position: absolute;
    left: 50%; top: 14px;
    width: 104px;
    margin-left: -52px;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(4px); } }
  .zz { position: absolute; left: calc(50% + 46px); top: 8px; font-size: 10px; font-weight: 700; color: var(--slate-soft); opacity: 0.7; animation: zz 2.6s ease-in-out infinite; }
  .playing .zz { display: none; }
  @keyframes zz { 0% { transform: translate(0, 4px); opacity: 0; } 40% { opacity: 0.7; } 100% { transform: translate(6px, -8px); opacity: 0; } }
  .drop {
    position: absolute;
    top: 58px;
    width: 3px; height: 9px;
    border-radius: 3px 3px 3px 3px / 2px 2px 5px 5px;
    background: #A9C1D4;
    opacity: 0;
  }
  .playing .drop { animation: fall linear infinite; }
  @keyframes fall {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: 0.9; }
    100% { transform: translateY(72px); opacity: 0; }
  }
  .puddle { position: absolute; bottom: 8px; left: 50%; width: 120px; height: 8px; margin-left: -60px; border-radius: 50%; background: rgba(169, 193, 212, 0.25); }
  .mug { position: absolute; right: 16px; bottom: 6px; width: 46px; }
  .steam path { stroke-dasharray: 22; animation: steam 2.8s ease-in-out infinite; }
  .steam path:nth-child(2) { animation-delay: 0.9s; }
  @keyframes steam { 0% { stroke-dashoffset: 22; opacity: 0; } 40% { opacity: 0.7; } 100% { stroke-dashoffset: -22; opacity: 0; } }
  .book-mini { position: absolute; left: 14px; bottom: 6px; width: 50px; }

  /* ---------- controls ---------- */
  .controls { display: flex; align-items: center; gap: 14px; }
  .play {
    flex: none;
    width: 50px; height: 50px;
    border-radius: 18px;
    border: none;
    background: var(--slate);
    color: #fff;
    cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 6px 14px rgba(74, 85, 96, 0.22);
    transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
  }
  .play:hover { transform: translateY(-1px); }
  .play:active { transform: scale(0.94); }
  .playing .play { background: var(--matcha); box-shadow: 0 6px 14px rgba(126, 154, 123, 0.35); }
  .play svg { width: 18px; height: 18px; fill: currentColor; }
  .vol { flex: 1; min-width: 0; }
  .vol label { display: flex; justify-content: space-between; font-size: 11px; font-weight: 500; color: var(--slate-soft); margin-bottom: 9px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 6px;
    background: linear-gradient(90deg, var(--matcha) var(--p, 50%), var(--line) var(--p, 50%));
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 2px solid var(--matcha);
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 2px solid var(--matcha);
  }

  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px; }
  .chip {
    font: inherit; font-size: 11.5px; font-weight: 600;
    padding: 8px 0;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--slate-soft);
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip .e { margin-right: 3px; filter: grayscale(1); opacity: 0.6; transition: filter 0.2s, opacity 0.2s; }
  .chip.on { background: var(--matcha-soft); border-color: #CFDDCD; color: #5F7D5C; }
  .chip.on .e { filter: none; opacity: 1; }

  .divider { display: flex; align-items: center; gap: 8px; margin: 16px 0 12px; color: #C9D0D6; font-size: 10px; }
  .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px dashed var(--line); }

  .log { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .stats .n { font-size: 24px; font-weight: 700; line-height: 1; min-width: 18px; text-align: center; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .step {
    width: 24px; height: 24px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--bg);
    color: var(--slate-soft); font: inherit; font-size: 14px; font-weight: 600; line-height: 1;
    cursor: pointer; display: grid; place-items: center;
    transition: color 0.2s, border-color 0.2s, transform 0.1s;
  }
  .step:hover { color: var(--matcha); border-color: #CFDDCD; }
  .step:active { transform: scale(0.9); }
  .step:disabled { opacity: 0.4; cursor: default; }
  .stats .t { font-size: 11px; color: var(--slate-soft); margin-top: 4px; }
  .flip {
    font: inherit; font-size: 12px; font-weight: 600;
    padding: 11px 14px;
    border-radius: 16px;
    border: none;
    background: var(--matcha);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(126, 154, 123, 0.3);
    transition: transform 0.15s, background 0.2s;
  }
  .flip:hover { background: #718D6E; }
  .flip:active { transform: scale(0.96); }
  .flip svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.5s; }
  .flip.turn svg { transform: rotateY(180deg); }

  .week-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; gap: 8px; }
  .week-nav .label { font-size: 11px; font-weight: 600; color: var(--slate); text-align: center; }
  .week-nav .label small { display: block; font-size: 10px; font-weight: 500; color: var(--slate-soft); margin-top: 1px; }
  .week-nav .arrow {
    width: 26px; height: 26px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--slate-soft);
    font: inherit; font-size: 14px; cursor: pointer; display: grid; place-items: center;
    transition: color 0.2s, border-color 0.2s;
  }
  .week-nav .arrow:hover { color: var(--matcha); border-color: #CFDDCD; }
  .week-nav .arrow:disabled { opacity: 0.35; cursor: default; color: var(--slate-soft); border-color: var(--line); }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 10px; text-align: center; }
  .day .cnt { font-size: 9px; font-weight: 500; color: var(--matcha); min-height: 11px; margin-top: -2px; }
  .day {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font: inherit; font-size: 9.5px; font-weight: 600; color: var(--slate-soft);
    background: none; border: 1px solid transparent; border-radius: 12px;
    padding: 5px 0 3px; cursor: pointer; transition: background 0.2s, border-color 0.2s;
  }
  .day:hover:not(:disabled) { background: var(--bg); }
  .day:disabled { cursor: default; }
  .day.sel { background: var(--matcha-soft); border-color: #CFDDCD; color: var(--slate); }
  .leaf { width: 18px; height: 18px; }
  .leaf path { fill: var(--line); transition: fill 0.3s; }
  .day.on .leaf path { fill: var(--matcha); }
  .day.today { color: var(--slate); }
  .day.future { opacity: 0.45; }
  .day.pop .leaf { animation: pop 0.45s ease; }
  @keyframes pop { 50% { transform: scale(1.35) rotate(-10deg); } }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="top">
    <div>
      <div class="eyebrow">雨 · ambience</div>
      <h1>Rainy Reading</h1>
    </div>
    <div class="pill"><span class="dot"></span><span id="stateText">paused</span></div>
  </div>

  <div class="scene" id="scene" aria-hidden="true">
    <div class="zz">z z</div>
    <svg class="cloud" viewBox="0 0 104 56">
      <path d="M22 50 C8 50 4 36 14 30 C12 18 26 12 34 18 C38 6 58 2 66 14 C76 8 92 14 90 28 C102 30 102 50 86 50 Z" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="1.5"/>
      <g id="eyesClosed" stroke="#4A5560" stroke-width="1.8" fill="none" stroke-linecap="round">
        <path d="M38 33 Q42 36 46 33"/><path d="M58 33 Q62 36 66 33"/>
      </g>
      <g id="eyesOpen" fill="#4A5560" style="display:none">
        <circle cx="42" cy="33" r="2.4"/><circle cx="62" cy="33" r="2.4"/>
        <circle cx="42.8" cy="32.2" r="0.8" fill="#fff"/><circle cx="62.8" cy="32.2" r="0.8" fill="#fff"/>
      </g>
      <path d="M49 38 Q52 41 55 38" stroke="#4A5560" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="34" cy="39" rx="4" ry="2.4" fill="#F4D9D4"/><ellipse cx="70" cy="39" rx="4" ry="2.4" fill="#F4D9D4"/>
    </svg>
    <div class="puddle"></div>
    <svg class="book-mini" viewBox="0 0 50 22">
      <rect x="2" y="12" width="44" height="8" rx="2" fill="#C9D6C7"/>
      <rect x="4" y="5" width="40" height="8" rx="2" fill="#F4D9D4"/>
      <rect x="8" y="7.5" width="14" height="2" rx="1" fill="#fff" opacity="0.8"/>
      <rect x="6" y="14.5" width="18" height="2" rx="1" fill="#fff" opacity="0.8"/>
    </svg>
    <svg class="mug" viewBox="0 0 46 48">
      <g class="steam" stroke="#B9C3CB" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M16 18 C12 13 20 10 16 3"/><path d="M26 18 C22 13 30 10 26 3"/>
      </g>
      <path d="M6 22 H36 V38 C36 43 32 46 27 46 H15 C10 46 6 43 6 38 Z" fill="#7E9A7B"/>
      <path d="M36 26 C44 26 44 38 36 38" fill="none" stroke="#7E9A7B" stroke-width="3"/>
      <ellipse cx="21" cy="22" rx="15" ry="3" fill="#A9BFA6"/>
      <path d="M15 33 Q17 35 19 33 M23 33 Q25 35 27 33" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <ellipse cx="13" cy="37" rx="2" ry="1.2" fill="#F4D9D4"/><ellipse cx="29" cy="37" rx="2" ry="1.2" fill="#F4D9D4"/>
    </svg>
  </div>

  <div class="controls">
    <button class="play" id="play" type="button" aria-label="Play">
      <svg id="icon" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <div class="vol">
      <label for="volume"><span>Volume</span><span id="volVal">50%</span></label>
      <input type="range" id="volume" min="0" max="100" value="50">
    </div>
  </div>

  <div class="chips">
    <button class="chip" data-layer="rain" type="button"><span class="e">🌧</span>Rain</button>
    <button class="chip" data-layer="thunder" type="button"><span class="e">⛈</span>Thunder</button>
    <button class="chip" data-layer="vinyl" type="button"><span class="e">🎧</span>Lo-fi</button>
  </div>

  <div class="divider">✿</div>

  <div class="log">
    <div class="stats">
      <div class="stepper">
        <button class="step" id="minus" type="button" aria-label="Remove a session">−</button>
        <div class="n" id="today">0</div>
        <button class="step" id="plus" type="button" aria-label="Add a session">+</button>
      </div>
      <div class="t"><span id="dayLabel">sessions today</span> · <span id="total">0</span> total</div>
    </div>
    <button class="flip" id="flip" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 6.5c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5zM12 6.5V20"/></svg>
      Log a session
    </button>
  </div>
  <div class="week-nav">
    <button class="arrow" id="prevWeek" type="button" aria-label="Previous week">‹</button>
    <div class="label"><span id="weekTitle">This week</span><small id="weekSum">0 sessions</small></div>
    <button class="arrow" id="nextWeek" type="button" aria-label="Next week">›</button>
  </div>
  <div class="week" id="week"></div>
</main>

<script>
  (function () {
    var KEY = 'notion-rain-v1';
    var defaults = { volume: 50, layers: { rain: true, thunder: false, vinyl: true }, sessions: {} };
    var data;
    try { data = Object.assign({}, defaults, JSON.parse(localStorage.getItem(KEY)) || {}); }
    catch (e) { data = defaults; }
    data.layers = Object.assign({}, defaults.layers, data.layers);
    function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

    var card = document.getElementById('card');
    var playBtn = document.getElementById('play');
    var icon = document.getElementById('icon');
    var vol = document.getElementById('volume');
    var ctx = null, master = null, layerGains = {}, playing = false, timers = [];

    // raindrops falling from the cloud
    var scene = document.getElementById('scene');
    for (var i = 0; i < 14; i++) {
      var d = document.createElement('span');
      d.className = 'drop';
      d.style.left = 'calc(50% + ' + (-38 + Math.random() * 76) + 'px)';
      d.style.animationDuration = (0.8 + Math.random() * 0.5) + 's';
      d.style.animationDelay = (Math.random() * 1.2) + 's';
      scene.appendChild(d);
    }

    // ---------- Audio ----------
    function noiseBuffer(type, seconds) {
      var len = ctx.sampleRate * seconds;
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var out = buf.getChannelData(0);
      var last = 0, b0 = 0, b1 = 0, b2 = 0;
      for (var i = 0; i < len; i++) {
        var w = Math.random() * 2 - 1;
        if (type === 'brown') {
          last = (last + 0.02 * w) / 1.02;
          out[i] = last * 3.5;
        } else if (type === 'pink') {
          b0 = 0.99765 * b0 + w * 0.0990460;
          b1 = 0.96300 * b1 + w * 0.2965164;
          b2 = 0.57000 * b2 + w * 1.0526913;
          out[i] = (b0 + b1 + b2 + w * 0.1848) * 0.11;
        } else {
          out[i] = w;
        }
      }
      return buf;
    }

    function loopSource(buf) {
      var s = ctx.createBufferSource();
      s.buffer = buf; s.loop = true; s.start();
      return s;
    }

    function buildRain(dest) {
      // Base: filtered pink noise = steady rain
      var src = loopSource(noiseBuffer('pink', 4));
      var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 400;
      var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6500;
      var g = ctx.createGain(); g.gain.value = 0.55;
      src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(dest);
      // Low rumble
      var low = loopSource(noiseBuffer('brown', 4));
      var lg = ctx.createGain(); lg.gain.value = 0.35;
      low.connect(lg); lg.connect(dest);
      // Individual drips
      var white = noiseBuffer('white', 1);
      (function drip() {
        if (!playing) return;
        var s = ctx.createBufferSource(); s.buffer = white;
        var bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
        bp.frequency.value = 2500 + Math.random() * 4000; bp.Q.value = 6;
        var e = ctx.createGain(); var t = ctx.currentTime;
        e.gain.setValueAtTime(0, t);
        e.gain.linearRampToValueAtTime(0.25 * Math.random(), t + 0.004);
        e.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
        s.connect(bp); bp.connect(e); e.connect(dest);
        s.start(t, Math.random() * 0.9, 0.08);
        timers.push(setTimeout(drip, 30 + Math.random() * 140));
      })();
    }

    function buildThunder(dest) {
      var brown = noiseBuffer('brown', 6);
      (function rumble() {
        if (!playing) return;
        var s = ctx.createBufferSource(); s.buffer = brown;
        var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180;
        var e = ctx.createGain(); var t = ctx.currentTime;
        e.gain.setValueAtTime(0, t);
        e.gain.linearRampToValueAtTime(1.4, t + 0.6);
        e.gain.exponentialRampToValueAtTime(0.001, t + 5.5);
        s.connect(lp); lp.connect(e); e.connect(dest);
        s.start(t); s.stop(t + 6);
        timers.push(setTimeout(rumble, 14000 + Math.random() * 20000));
      })();
    }

    function buildVinyl(dest) {
      // Soft hiss + vinyl crackle
      var hiss = loopSource(noiseBuffer('white', 2));
      var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 5000; bp.Q.value = 0.6;
      var hg = ctx.createGain(); hg.gain.value = 0.025;
      hiss.connect(bp); bp.connect(hg); hg.connect(dest);
      (function crackle() {
        if (!playing) return;
        var o = ctx.createBufferSource();
        var len = 64, b = ctx.createBuffer(1, len, ctx.sampleRate), c = b.getChannelData(0);
        for (var i = 0; i < len; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / len);
        o.buffer = b;
        var g = ctx.createGain(); g.gain.value = 0.15 + Math.random() * 0.25;
        o.connect(g); g.connect(dest); o.start();
        timers.push(setTimeout(crackle, 80 + Math.random() * 600));
      })();
      // Warm lo-fi pad (soft Fmaj7 chord)
      [174.61, 220.0, 261.63, 329.63].forEach(function (f, i) {
        var osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = f;
        var lfo = ctx.createOscillator(); lfo.frequency.value = 0.08 + i * 0.03;
        var lfoG = ctx.createGain(); lfoG.gain.value = 0.012;
        var g = ctx.createGain(); g.gain.value = 0.018;
        lfo.connect(lfoG); lfoG.connect(g.gain);
        osc.connect(g); g.connect(dest); osc.start(); lfo.start();
      });
    }

    function start() {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.setValueAtTime(0, ctx.currentTime);
      master.connect(ctx.destination);
      playing = true;
      [['rain', buildRain], ['thunder', buildThunder], ['vinyl', buildVinyl]].forEach(function (p) {
        var g = ctx.createGain();
        g.gain.value = data.layers[p[0]] ? 1 : 0;
        g.connect(master);
        layerGains[p[0]] = g;
        p[1](g);
      });
      master.gain.linearRampToValueAtTime(curve(data.volume), ctx.currentTime + 1.2);
    }

    function stop() {
      playing = false;
      timers.forEach(clearTimeout); timers = [];
      if (!ctx) return;
      var c = ctx;
      master.gain.cancelScheduledValues(c.currentTime);
      master.gain.setValueAtTime(master.gain.value, c.currentTime);
      master.gain.linearRampToValueAtTime(0, c.currentTime + 0.6);
      setTimeout(function () { c.close(); }, 700);
      ctx = null;
    }

    function curve(v) { return Math.pow(v / 100, 2) * 0.9; }

    function pageFlip() {
      var c = ctx || new (window.AudioContext || window.webkitAudioContext)();
      var t = c.currentTime, dur = 0.42;
      var len = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (var i = 0; i < len; i++) {
        var x = i / len;
        // two paper "swishes": drag + settle
        var env = Math.pow(Math.sin(Math.PI * Math.min(x / 0.75, 1)), 1.5) + (x > 0.7 ? Math.exp(-(x - 0.7) * 30) * 0.8 : 0);
        d[i] = (Math.random() * 2 - 1) * env * (0.6 + 0.4 * Math.random());
      }
      var s = c.createBufferSource(); s.buffer = b;
      var bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
      bp.frequency.setValueAtTime(1200, t);
      bp.frequency.linearRampToValueAtTime(3800, t + dur * 0.7);
      bp.frequency.linearRampToValueAtTime(1600, t + dur);
      var g = c.createGain(); g.gain.value = 0.35;
      s.connect(bp); bp.connect(g); g.connect(c.destination);
      s.start(t);
      if (!ctx) setTimeout(function () { c.close(); }, 800);
    }

    // ---------- UI ----------
    var PLAY = '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>';
    var PAUSE = '<rect x="6" y="5" width="4.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"/>';
    function setPlaying(p) {
      card.classList.toggle('playing', p);
      document.getElementById('stateText').textContent = p ? 'raining' : 'paused';
      document.getElementById('eyesOpen').style.display = p ? '' : 'none';
      document.getElementById('eyesClosed').style.display = p ? 'none' : '';
      playBtn.setAttribute('aria-label', p ? 'Mute' : 'Play');
      icon.innerHTML = p ? PAUSE : PLAY;
    }
    playBtn.addEventListener('click', function () {
      if (playing) stop(); else start();
      setPlaying(playing);
    });

    function paintVol() {
      vol.style.setProperty('--p', vol.value + '%');
      document.getElementById('volVal').textContent = vol.value + '%';
    }
    vol.value = data.volume; paintVol();
    vol.addEventListener('input', function () {
      data.volume = +vol.value; paintVol(); save();
      if (ctx) master.gain.setTargetAtTime(curve(data.volume), ctx.currentTime, 0.08);
    });

    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
      var k = chip.dataset.layer;
      chip.classList.toggle('on', data.layers[k]);
      chip.addEventListener('click', function () {
        data.layers[k] = !data.layers[k];
        chip.classList.toggle('on', data.layers[k]);
        save();
        if (ctx) layerGains[k].gain.setTargetAtTime(data.layers[k] ? 1 : 0, ctx.currentTime, 0.25);
      });
    });

    function dayKey(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    var LEAF = '<svg class="leaf" viewBox="0 0 20 20"><path d="M4 16 C3 8 9 3 17 3 C17 11 12 17 4 16 Z M4 16 L11 9" /></svg>';
    function renderLog(popSel) {
      var today = dayKey(new Date());
      if (selected > today) selected = today;
      var n0 = data.sessions[selected] || 0;
      document.getElementById('today').textContent = n0;
      document.getElementById('minus').disabled = !n0;
      document.getElementById('dayLabel').textContent = selected === today ? 'sessions today' : 'on ' + prettyDay(selected);
      var total = 0; for (var k in data.sessions) total += data.sessions[k];
      document.getElementById('total').textContent = total;
      var week = document.getElementById('week');
      week.innerHTML = '';
      // calendar week Monday to Sunday; weekOffset 0 = this week, -1 = last week, ...
      var names = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
      var monday = new Date(); monday.setDate(monday.getDate() - (monday.getDay() + 6) % 7 + weekOffset * 7);
      var sum = 0;
      for (var i = 0; i < 7; i++) {
        var d = new Date(monday); d.setDate(monday.getDate() + i);
        var k = dayKey(d), n = data.sessions[k] || 0, isSel = k === selected;
        sum += n;
        var el = document.createElement('button');
        el.type = 'button';
        el.dataset.k = k;
        el.disabled = k > today;
        el.className = 'day' + (n ? ' on' : '') + (k === today ? ' today' : '') + (k > today ? ' future' : '') + (isSel ? ' sel' : '') + (isSel && popSel ? ' pop' : '');
        el.title = prettyDay(k) + ' · ' + n + ' session' + (n === 1 ? '' : 's');
        el.innerHTML = LEAF + '<span>' + names[i] + '</span><span class="cnt">' + (n ? '×' + n : '') + '</span>';
        week.appendChild(el);
      }
      var sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
      document.getElementById('weekTitle').textContent =
        weekOffset === 0 ? 'This week' : weekOffset === -1 ? 'Last week'
        : MONTHS[monday.getMonth()] + ' ' + monday.getDate() + ' – ' + MONTHS[sunday.getMonth()] + ' ' + sunday.getDate();
      document.getElementById('weekSum').textContent = sum + ' session' + (sum === 1 ? '' : 's');
      document.getElementById('nextWeek').disabled = weekOffset >= 0;
    }
    var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function prettyDay(k) { var p = k.split('-'); return MONTHS[+p[1] - 1] + ' ' + (+p[2]); }
    var weekOffset = 0;
    var selected = dayKey(new Date());          // the day the − / + buttons edit
    function backToToday() { weekOffset = 0; selected = dayKey(new Date()); }

    document.getElementById('prevWeek').addEventListener('click', function () { weekOffset--; renderLog(false); });
    document.getElementById('nextWeek').addEventListener('click', function () { if (weekOffset < 0) { weekOffset++; renderLog(false); } });
    document.getElementById('week').addEventListener('click', function (e) {
      var el = e.target.closest('.day');
      if (!el || el.disabled) return;
      selected = el.dataset.k;
      renderLog(false);
    });

    var flipBtn = document.getElementById('flip');
    flipBtn.addEventListener('click', function () {
      backToToday();
      data.sessions[selected] = (data.sessions[selected] || 0) + 1;
      save(); renderLog(true); pageFlip();
      flipBtn.classList.toggle('turn');
    });
    function adjustSelected(n) {
      var v = Math.max(0, (data.sessions[selected] || 0) + n);
      if (v) data.sessions[selected] = v; else delete data.sessions[selected];
      save(); renderLog(n > 0);
    }
    document.getElementById('plus').addEventListener('click', function () { adjustSelected(1); });
    document.getElementById('minus').addEventListener('click', function () { adjustSelected(-1); });
    renderLog(false);
  })();
</script>
</body>
</html>
